<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>班级积分管理系统</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js" defer></script>
<style>
:root{
  --primary:#60cdff; --primary-hover:#4cc2ff;
  --success:#4cc9a0; --success-hover:#3ab88a;
  --danger:#c74b50; --danger-bg:#fdf2f2;
  --text:#1a1a1a; --text-2:#666; --text-3:#999;
  --page-bg:#f3f3f3; --card:#fff; --border:#e0e0e0; --border-light:#f0f0f0;
  --sidebar-bg:#202020; --sidebar-text:#999;
  --shadow:0 1px 3px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  color:var(--text); background:var(--page-bg); font-size:14px;
  -webkit-font-smoothing:antialiased;
}
.hidden{display:none !important}
a{color:var(--primary); text-decoration:none}

/* ---------- 通用按钮 ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:none; border-radius:8px; cursor:pointer; font-size:14px; font-weight:600;
  padding:9px 16px; line-height:1.2; color:#1a1a1a; background:var(--border-light);
  transition:filter .15s, background .15s; white-space:nowrap;
}
.btn:hover{filter:brightness(.96)}
.btn:active{filter:brightness(.9)}
.btn-primary{background:var(--primary)}
.btn-success{background:var(--success)}
.btn-danger{background:var(--danger); color:#fff}
.btn-danger:hover{filter:brightness(.92)}
.btn-ghost{background:#fff; border:1px solid #d4d4d4; color:var(--text)}
.btn-outline-danger{background:transparent; border:1px solid #e0a0a2; color:var(--danger)}
.btn-mini{font-size:12px; padding:5px 10px; border-radius:6px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5; cursor:not-allowed}

/* ---------- 输入控件 ---------- */
.input, select.input, .field{
  border:1px solid #d4d4d4; border-radius:8px; background:#fff; color:var(--text);
  font-size:14px; padding:9px 12px; min-height:38px; outline:none; transition:border .15s;
  font-family:inherit;
}
.input:focus, select.input:focus{ border-color:var(--primary); box-shadow:0 0 0 2px rgba(96,205,255,.2) }
textarea.input{min-height:60px; resize:vertical}

/* ---------- 日期选择卡（整块可点） ---------- */
.date-box{position:relative; flex:1 1 100%; border:1px solid #d4d4d4; border-radius:10px; background:#fff; padding:10px 12px; cursor:pointer; overflow:hidden}
.date-tap{font-size:13px; color:var(--primary); font-weight:600; text-align:center; pointer-events:none}
.date-val{font-size:18px; font-weight:600; color:var(--text); text-align:center; margin-top:4px; pointer-events:none}
.date-box input[type=date]{position:absolute; left:0; top:0; width:100%; height:100%; opacity:0; cursor:pointer; border:0; padding:0; font-size:16px; pointer-events:none}

/* ---------- 自定义日历面板 ---------- */
.cal-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:14px 0 12px}
.cal-title{font-size:16px; font-weight:700; color:var(--text)}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; text-align:center}
.cal-week{color:var(--text-3); font-size:12px; margin-bottom:6px}
.cal-cell{display:flex; align-items:center; justify-content:center; height:40px; border:none; border-radius:8px; background:var(--border-light); font-size:15px; cursor:pointer; color:var(--text); font-family:inherit}
.cal-cell:hover{background:rgba(96,205,255,.25)}
.cal-empty{background:transparent; cursor:default}
.cal-empty:hover{background:transparent}
.cal-today{border:2px solid var(--primary); color:var(--primary); font-weight:700}
.cal-sel{background:var(--primary); color:#1a1a1a; font-weight:700}

/* ---------- 登录屏 ---------- */
.screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px}
.login-card{
  width:100%; max-width:400px; background:var(--card); border-radius:14px;
  box-shadow:var(--shadow); padding:36px 30px 28px;
}
.brand{text-align:center; margin-bottom:26px}
.brand-title{font-size:28px; font-weight:700; color:var(--text)}
.brand-sub{font-size:12px; color:#888; letter-spacing:1px; margin-top:4px}
.field-group{margin-bottom:14px}
.field-group label{display:block; font-size:13px; color:#444; margin-bottom:6px}
.field-group .field{width:100%}
.login-hint{text-align:center; color:#888; font-size:11px; margin-top:12px}

/* ---------- 应用框架 ---------- */
#app{min-height:100vh}
#sidebar{
  position:fixed; left:0; top:0; bottom:0; width:220px; background:var(--sidebar-bg);
  display:flex; flex-direction:column; z-index:50; transition:transform .25s;
}
.sb-brand{padding:22px 20px 18px}
.sb-brand .t{font-size:15px; font-weight:700; color:#e0e0e0}
.sb-brand .s{font-size:10px; color:#666; margin-top:2px; letter-spacing:.5px}
.sb-sep{height:1px; background:#333; margin:0}
.sb-nav{flex:1; overflow-y:auto; padding:8px 0}
.nav-item{
  display:block; width:100%; text-align:left; background:transparent; border:none;
  color:#ccc; font-size:13.5px; padding:11px 18px; cursor:pointer; border-radius:4px;
  margin:2px 10px; transition:background .15s, color .15s;
}
.nav-item:hover{background:#2d2d2d; color:#fff}
.nav-item.active{background:rgba(96,205,255,.15); color:var(--primary); border-left:3px solid var(--primary)}
.sb-user{display:flex; align-items:center; gap:10px; padding:12px 16px 14px; border-top:1px solid #333}
.avatar{width:34px; height:34px; border-radius:8px; background:var(--primary); color:#1a1a1a;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px}
.sb-user .name{font-size:12.5px; color:#e0e0e0}
.sb-user .role{font-size:10px; color:#777}
.sb-logout{
  margin:4px 10px 12px; padding:9px; text-align:center; background:transparent; border:none;
  color:#777; font-size:12px; border-radius:6px; cursor:pointer;
}
.sb-logout:hover{background:#2d2d2d; color:var(--danger)}

#main{margin-left:220px; min-height:100vh; display:flex; flex-direction:column}
#topbar{
  background:#fff; border-bottom:1px solid var(--border); padding:12px 20px;
  display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:30;
}
#menuBtn{
  display:none; background:none; border:none; font-size:22px; cursor:pointer; color:var(--text);
  padding:0 4px; line-height:1;
}
#topTitle{font-size:17px; font-weight:700; flex:1}
#overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:40; display:none}

#page{padding:20px; flex:1}

/* ---------- 页面通用 ---------- */
.page-header{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px}
.page-header h1{font-size:21px; font-weight:700; margin:0}
.chip{background:#e8f5fc; color:var(--primary); font-size:12px; font-weight:600;
  padding:4px 12px; border-radius:999px}
.card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; overflow-x:auto}
/* V2.0.6：未包 table-wrap 的表格也在卡片内横向滚动，页面本身不再横向溢出 */
#page{overflow-x:clip}
.toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px}
.toolbar .lbl{font-size:13px; color:var(--text-2); white-space:nowrap}
.toolbar .grow{flex:1}
.form-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px}

/* ---------- 表格 ---------- */
.table-wrap{overflow:auto; max-height:calc(100vh - 232px); background:var(--card); border:1px solid var(--border); border-radius:12px}
.table-wrap thead th{position:sticky; top:0; z-index:2; background:var(--card); box-shadow:inset 0 -1px 0 var(--border)}
table.data{width:100%; border-collapse:collapse; font-size:13px; min-width:640px}
table.data th{
  background:#fafafa; color:#666; font-size:12px; font-weight:600; text-align:left;
  padding:11px 14px; border-bottom:1px solid var(--border); white-space:nowrap;
}
table.data td{padding:10px 14px; border-bottom:1px solid var(--border-light); white-space:nowrap}
table.data tr:last-child td{border-bottom:none}
table.data tbody tr:hover{background:#fafafa}
.pos{color:var(--success); font-weight:600}
.neg{color:var(--danger); font-weight:600}
.dim{color:var(--text-3)}
.empty{padding:40px 16px; text-align:center; color:var(--text-3)}
.row-actions{display:flex; gap:6px}

/* ---------- 导出卡片 ---------- */
.export-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px}
.export-card{
  background:#fff; border:1px solid var(--border); border-left:4px solid var(--primary);
  border-radius:10px; padding:16px; cursor:pointer; text-align:left; transition:transform .12s, box-shadow .12s;
}
.export-card:hover{transform:translateY(-2px); box-shadow:var(--shadow)}
.export-card .t{font-size:14px; font-weight:700; color:var(--text); margin-bottom:6px}
.export-card .d{font-size:12px; color:#6b7280}

/* ---------- 设置卡片 ---------- */
.settings-card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom:16px}
.settings-card h3{margin:0 0 10px; font-size:15px; font-weight:700}
.settings-card .desc{font-size:13px; color:var(--text-3); margin-bottom:12px; line-height:1.6}

/* ---------- 弹窗 ---------- */
#modalOverlay{
  position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:100;
  display:flex; align-items:center; justify-content:center; padding:16px;
}
#modalBox{
  background:#fff; border-radius:12px; width:100%; max-width:440px; max-height:88vh;
  overflow-y:auto; padding:22px 22px 18px;
}
#modalBox h3{margin:0 0 14px; font-size:17px; font-weight:700}
.modal-msg{font-size:14px; color:var(--text-2); line-height:1.6; margin:0 0 16px}
.modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px}
.modal-field{margin-bottom:12px}
.modal-field label{display:block; font-size:13px; color:#444; margin-bottom:6px}
.modal-field .field, .modal-field .input{width:100%}
.modal-field select.field{width:100%}

/* ---------- Toast ---------- */
#toast{
  position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-80px);
  background:#1a1a1a; color:#fff; padding:11px 20px; border-radius:8px; font-size:14px;
  z-index:200; box-shadow:0 6px 20px rgba(0,0,0,.3); transition:transform .3s; max-width:88vw; text-align:center;
}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--danger)}
#toast.ok{background:#2e8b57}

/* ---------- 小组选择屏 ---------- */
.group-card{width:100%; max-width:380px; background:#fff; border-radius:14px; box-shadow:var(--shadow); padding:30px 28px; text-align:center}
.group-card h2{font-size:18px; margin:0 0 20px}
.group-card select{width:100%; margin-bottom:16px}

/* ---------- V2.0：周期状态条 / 维护遮罩 / 状态标 ---------- */
.period-bar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-left:auto}
.pill{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600;
  padding:4px 10px; border-radius:999px; background:#f2f7fb; color:#4a6b7c; white-space:nowrap}
.pill-week{background:#eef7ff; color:#2b7fb0}
.pill-month{background:#f2f0ff; color:#6b5bd2}
.pill-warn{background:#fff6e5; color:#9a6b00}
.pill-danger{background:#fdecec; color:var(--danger)}
.pill-ok{background:#eaf8f2; color:#2f8f6b}
.maintenance-banner{background:#fff4e5; border-bottom:1px solid #f0dcb4; color:#8a5b00;
  padding:10px 20px; font-size:13px; display:flex; gap:8px; align-items:center}
.readonly-mask{background:#fff4e5; border:1px solid #f0dcb4; color:#8a5b00; border-radius:10px;
  padding:10px 14px; font-size:13px; margin-bottom:14px}
.freeze-hint{color:#9a6b00; font-size:12px}
.limit-hint{color:#2b7fb0; font-size:12px}
.limit-over{color:var(--danger); font-weight:600}
.badge-role{font-size:11px; padding:2px 8px; border-radius:999px; background:#eef7ff; color:#2b7fb0; font-weight:600}
.badge-status{font-size:11px; padding:2px 8px; border-radius:999px; background:#f2f2f2; color:#666; font-weight:600}
.settings-card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px}
.settings-card h3{margin:0 0 10px; font-size:15px}
.settings-card .desc{color:var(--text-2); font-size:13px; margin-bottom:12px}
.form-row{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px}
.form-row label{font-size:13px; color:var(--text-2); min-width:110px}
.kv{display:flex; gap:8px; flex-wrap:wrap; font-size:13px; color:var(--text-2); margin-bottom:8px}
.kv b{color:var(--text); font-weight:600}

/* ---------- 响应式 ---------- */
@media (max-width:768px){
  #sidebar{transform:translateX(-100%); width:250px}
  #sidebar.open{transform:translateX(0)}
  #main{margin-left:0}
  #menuBtn{display:block}
  #page{padding:14px}
  .toolbar .field{flex:1 1 100%}
  .toolbar{ row-gap:10px }
  .page-header h1{font-size:18px}
  table.data{min-width:0}
  .export-grid{grid-template-columns:1fr 1fr}
  .input, .field, select{font-size:16px}
  .period-bar{width:100%; margin-left:0; padding-top:4px}
  .form-row label{min-width:0; width:100%}
}
@media (max-width:420px){
  .export-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
}
/* M5 抽选/汇总 */
.tab-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab-btn{padding:8px 16px;border-radius:10px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:14px;color:var(--text)}
.tab-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.draw-result{padding:14px;border:1px dashed var(--primary);border-radius:12px;margin-bottom:12px;text-align:center;background:#f8fbff}
.draw-title{font-size:20px;font-weight:700;color:var(--primary);margin-bottom:6px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sub-title{font-weight:600;margin:12px 0 8px;color:var(--text)}
.badge-status.badge-ok{background:#e7f7ee;color:#12805c}
.badge-status.badge-warn{background:#fff4e5;color:#a35c00}
.badge-status.badge-danger{background:#fdecec;color:#c0392b}
.badge-status.badge-dim{background:#eef0f3;color:#6b7280}
@media (max-width:768px){ .grid-2{grid-template-columns:1fr} }
/* M6/M7 通知/申诉/台账 */
.login-links{margin-top:12px;text-align:center;font-size:13px}
.login-links a{color:var(--primary);text-decoration:none}
.unread-badge{display:inline-block;min-width:18px;height:18px;line-height:18px;padding:0 5px;border-radius:9px;background:#e5484d;color:#fff;font-size:11px;text-align:center;margin-left:6px;vertical-align:middle}
.inbox-list .inbox-item{padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer}
.inbox-list .inbox-item:last-child{border-bottom:none}
.inbox-list .inbox-item.unread{background:#f8fbff;margin:0 -12px;padding:12px}
.inbox-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.inbox-title{font-weight:600;font-size:14px}
.inbox-meta{font-size:12px;color:var(--text-dim)}
.inbox-body{font-size:13px;margin-top:4px;color:var(--text)}
.inbox-actions{margin-top:6px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e5484d;margin-right:5px;vertical-align:middle}
.appeal-item{padding:12px 0;border-bottom:1px solid var(--border)}
.check-list{max-height:300px;overflow:auto;border:1px solid var(--border);border-radius:10px;padding:8px}
.check-item{display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:14px}

/* V2.0 前端补充：多级菜单 / 未读角标 / 明细表横向滚动 / 职务标签 */
.nav-group{margin-top:4px}
.nav-group-title{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;font-size:12px;color:var(--text-2);cursor:pointer;border-radius:8px;user-select:none}
.nav-group-title:hover{background:rgba(0,0,0,.04)}
.nav-group-items{display:block}
.nav-group.collapsed .nav-group-items{display:none}
.nav-caret{transition:transform .15s;font-size:11px}
.nav-group.collapsed .nav-caret{transform:rotate(-90deg)}
.nav-item.sub{padding-left:22px}
.nav-item .nav-badge{margin-left:auto;background:#e5484d;color:#fff;font-size:11px;line-height:16px;min-width:16px;height:16px;padding:0 4px;border-radius:8px}
.nav-item{display:flex;align-items:center;gap:6px}
table.data{min-width:1080px}
table.data.data-compact{min-width:720px}
.inbox-item{cursor:pointer}
.pos-chk{display:inline-flex;align-items:center;gap:4px;margin:0 10px 0 0;font-size:13px;color:var(--text-1)}
.pos-badge{display:inline-block;margin:0 4px 2px 0;padding:1px 6px;border-radius:10px;background:#eef4ff;color:#2453a6;font-size:12px}

/* ===== V2.0.4 抽奖机动画 ===== */
.lot-stage{position:relative;display:flex;align-items:center;justify-content:center;height:250px;margin:6px 0 2px}
.lot-ring{position:absolute;width:200px;height:200px;border-radius:50%;
  background:conic-gradient(from 0deg,#f7d774,#f2a93b,#fdebc0,#e8a13c,#f7d774);
  animation:lotRing 2.4s linear infinite;filter:blur(2px);opacity:.85}
.lot-ring-penalty{background:conic-gradient(from 0deg,#8fb7ff,#5b7fd6,#dfe9ff,#4f6fbd,#8fb7ff)}
@keyframes lotRing{to{transform:rotate(360deg)}}
.lot-card{position:relative;width:170px;height:220px;perspective:900px;z-index:1}
.lot-inner{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.lot-card.flipped .lot-inner{transform:rotateY(180deg)}
.lot-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:10px;text-align:center}
.lot-back{background:linear-gradient(160deg,#334,#556);color:#fff}
.lot-front{background:linear-gradient(160deg,#fff9e8,#ffe9b0);color:#4a3200;transform:rotateY(180deg)}
.lot-label{font-size:12px;opacity:.8;margin-bottom:10px;letter-spacing:2px}
.lot-big{font-size:20px;font-weight:700;line-height:1.35;word-break:break-all}
.lot-hint{text-align:center;color:var(--text-2);font-size:13px;margin:4px 0 8px}
.lot-extra{max-height:180px;overflow:auto}
#modalBox.modal-wide{max-width:900px}
.modal-box table.data{min-width:0}
  /* V2.0.9 表格直改 / 仓库分组合并 */
  table.data.my-list td.wrap{white-space:normal;word-break:break-word;line-height:1.5}
table.data.my-list{min-width:0}
.cell-input{ width:78px; padding:4px 6px; border:1px solid var(--border); border-radius:6px; background:var(--card); font-size:13px; }
  .cell-input.dirty{ border-color:#f59e0b; background:#fffbeb; }
  .wh-group-row td{ background:var(--bg-2); font-weight:600; cursor:pointer; }
  .wh-group-row .dim{ font-weight:400; }
  .imp-preview{ margin-top:10px; }
</style>
</head>
<body>

<!-- 登录屏 -->
<div id="loginScreen" class="screen">
  <div class="login-card">
    <div class="brand">
      <div class="brand-title">班级积分</div>
      <div class="brand-sub">Management System</div>
    </div>
    <form id="loginForm" onsubmit="doLogin(event); return false">
      <div class="field-group">
        <label>账号（用户名或邮箱）</label>
        <input class="field" id="loginUser" placeholder="请输入账号，如 admin" autocomplete="username">
      </div>
      <div class="field-group">
        <label>密码</label>
        <input class="field" id="loginPass" type="password" placeholder="请输入密码" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="min-height:42px; font-size:15px">登 录</button>
      <div class="login-links"><a href="javascript:openRegister()">学生注册（邀请码）</a></div>
    </form>
  </div>
</div>

<!-- 小组选择屏 -->
<div id="groupSelectScreen" class="screen hidden">
  <div class="group-card">
    <h2>请选择您要管理的小组</h2>
    <select id="groupSelect" class="input"></select>
    <button class="btn btn-primary btn-block" onclick="confirmGroup()">确认选择</button>
    <div style="margin-top:12px"><a href="#" onclick="backToLogin()">返回登录</a></div>

function mapRow(r){ if(!r) return r; const o = Object.assign({}, r); o._id = r.id; return o; }
function mapRows(list){ return (list || []).map(mapRow); }
function sanitizeProfile(p){ return { _id:p._id, username:p.username, name:p.name, role:p.role, group_name:p.group_name || null, created_at:p.created_at || null }; }
function uid(){ return session && session.user ? session.user._id : null; }
function maxRuleOrder(type, cat){ let m=0; DB.rules.forEach(r=>{ if(r.score_type===type && r.category===cat) m=Math.max(m, r.sort_order||0); }); return m; }
function nextRuleOrder(type, cat){ return maxRuleOrder(type, cat)+1; }

/* ==========================================================
   Supabase 数据层（将原有「云函数调用」桥接到 supabase-js）
========================================================== */
/* ==========================================================
   Supabase 数据层（V2.0）
   —— 所有写操作走 security definer RPC：权限、时间规则、2 秒冻结、
      规则上限、月度冻结全部由数据库判定，前端只负责收集与展示
========================================================= */
function rpcMsg(e){ return (e && e.message) ? e.message : '操作失败'; }

async function rpc(name, args){
  if(!sb) return { code:1, msg:'系统未初始化' };
  try{
    const hasArgs = args && Object.keys(args).length > 0;
    const { data, error } = hasArgs ? await sb.rpc(name, args) : await sb.rpc(name);
    if(error) return { code:1, msg: rpcMsg(error) };
    return { code:0, data };
  }catch(e){
    return { code:1, msg: '操作失败：' + ((e && e.message) || e) };
  }
}

async function call(action, params){
  params = params || {};
  if(!sb){ return { code:1, msg:'系统未初始化' }; }
  try{
    switch(action){
      case 'getData': return await fetchAllData();

      case 'addStudent': {
        const name = String(params.name||'').trim(), group = String(params.group_name||'').trim();
        if(!name || !group) return { code:1, msg:'姓名和小组不能为空' };
        const r = await rpc('admin_save_student', {
          p_name: name, p_group_name: group,
          p_student_no: params.student_no ? String(params.student_no).trim() : null,
          p_id: null
        });
        if(r.code!==0) return r;
        return { code:0, doc: mapRow(r.data) };
      }
      case 'updateStudent': {
        const name = String(params.name||'').trim(), group = String(params.group_name||'').trim();
        if(!name || !group) return { code:1, msg:'姓名和小组不能为空' };
        const r = await rpc('admin_save_student', {
          p_name: name, p_group_name: group,
          p_student_no: params.student_no ? String(params.student_no).trim() : null,
          p_id: params._id
        });
        if(r.code!==0) return r;
        return { code:0, doc: mapRow(r.data) };
      }
      case 'deleteStudents': {
        const ids = Array.isArray(params.ids) ? params.ids.filter(Boolean) : [];
        if(!ids.length) return { code:1, msg:'未选择学生' };
        for(const id of ids){
          const r = await rpc('admin_delete_student', { p_id: id });
          if(r.code!==0) return r;
        }
        return { code:0, count: ids.length };
      }
      case 'importStudents': {
        const rows = Array.isArray(params.rows) ? params.rows : [];
        const payload = [];
        for(const r of rows){
          if(!r || !r.name || !r.group_name) continue;
          payload.push({ name: String(r.name).trim(), group_name: String(r.group_name).trim(), student_no: r.student_no ? String(r.student_no).trim() : null });
        }
        if(!payload.length) return { code:0, count:0 };
        const r = await rpc('admin_import_students', { p_rows: payload });
        if(r.code!==0) return r;
        return { code:0, count: (r.data && (r.data.inserted != null ? r.data.inserted : r.data.count)) || payload.length, detail: r.data };
      }
      case 'addRecord': {
        const student_id = params.student_id;
        if(!student_id) return { code:1, msg:'请选择学生' };
        const points = Number(params.points);
        if(isNaN(points)) return { code:1, msg:'分值无效' };
        const r = await rpc('add_record', {
          p_student_id: student_id,
          p_score_type: params.score_type || '加分',
          p_category: String(params.category||''),
          p_reason: String(params.reason||''),
          p_points: points,
          p_record_date: params.record_date || todayStr(),
          p_rule_id: params.rule_id || null,
          p_evidence: params.evidence ? String(params.evidence).trim() : null
        });
        if(r.code!==0) return r;
        return { code:0, doc: mapRow(r.data) };
      }
      case 'updateRecord': {
        const reason = String(params.reason||'').trim();
        const points = Number(params.points);
        if(!reason) return { code:1, msg:'原因不能为空' };
        if(isNaN(points)) return { code:1, msg:'分值无效' };
        const r = await rpc('update_record', {
          p_id: params._id, p_reason: reason, p_points: points,
          p_evidence: params.evidence ? String(params.evidence).trim() : null,
          p_record_date: params.record_date || null
        });
        if(r.code!==0) return r;
        return { code:0, doc: r.data ? mapRow(r.data) : null };
      }
      case 'deleteRecord': {
        const r = await rpc('delete_record', { p_id: params._id });
        if(r.code!==0) return r;
        return { code:0 };
      }
      case 'addRule': {
        const d = { score_type: params.score_type || '加分', category: String(params.category||'').trim(), reason: String(params.reason||'').trim(), points: Number(params.points), remark: String(params.remark||'').trim(), limit_type: params.limit_type || 'none', limit_value: Number(params.limit_value)||0, sort_order: nextRuleOrder(params.score_type || '加分', String(params.category||'').trim()) };
        if(!d.category || !d.reason || isNaN(d.points)) return { code:1, msg:'请填写完整的规则' };
        const r = await rpc('admin_save_rule', { p_rule: d });
        if(r.code!==0) return r;
        return { code:0, doc: mapRow(r.data) };
      }
      case 'updateRule': {
        const d = { id: params._id, score_type: params.score_type || '加分', category: String(params.category||'').trim(), reason: String(params.reason||'').trim(), points: Number(params.points), remark: String(params.remark||'').trim(), limit_type: params.limit_type || 'none', limit_value: Number(params.limit_value)||0 };
        if(!d.category || !d.reason || isNaN(d.points)) return { code:1, msg:'请填写完整的规则' };
        const r = await rpc('admin_save_rule', { p_rule: d });
        if(r.code!==0) return r;
        return { code:0, doc: mapRow(r.data) };
      }
      case 'deleteRule': {
        const r = await rpc('admin_delete_rule', { p_id: params._id });
        if(r.code!==0) return r;
        return { code:0 };
      }
      case 'importRules': {
        const rules = Array.isArray(params.rules) ? params.rules : [];
        if(params.replace){
          for(const old of DB.rules.slice()){
            const del = await rpc('admin_delete_rule', { p_id: old._id });
            if(del.code!==0) return del;
          }
        }
        let count = 0;
        for(const rr of rules){
          if(!rr || !rr.score_type || !rr.category || !rr.reason || isNaN(Number(rr.points))) continue;
          const r = await rpc('admin_save_rule', { p_rule: {
            score_type: rr.score_type, category: rr.category, reason: rr.reason,
            points: Number(rr.points), remark: String(rr.remark||''),
            sort_order: nextRuleOrder(rr.score_type, rr.category) + count,
            limit_type: 'none', limit_value: 0
          }});
          if(r.code!==0) return r;
          count++;
        }
        return { code:0, count };
      }
      case 'addUser': {
        const r = await rpc('admin_create_user', {
          p_username: String(params.username||'').trim(),
          p_password: String(params.password||''),
          p_name: String(params.name||'').trim(),
          p_role: params.role,
          p_group: params.group_name ? String(params.group_name).trim() : null
        });
        if(r.code!==0) return r;
        if(!r.data) return { code:1, msg:'用户名已存在' };
        return { code:0, doc: { _id: r.data.id, username: r.data.username, name: r.data.name, role: r.data.role, group_name: r.data.group_name || null, status: r.data.status || 'active' } };
      }
      case 'changePassword': {
        return await rpc('admin_set_password', { p_id: params._id, p_password: String(params.password||'') });
      }
      case 'deleteUser': {
        return await rpc('admin_delete_user', { p_id: params._id });
      }
      case 'exportBackup': {
        const r = await rpc('admin_export_all', {});
        if(r.code!==0) return r;
        return { code:0, data: r.data };
      }
      case 'restoreBackup': {
        const r = await rpc('admin_restore_backup', { p_data: params.data, p_confirm: 'RESTORE' });
        if(r.code!==0) return r;
        return { code:0, data: r.data };
      }
      case 'resetData': {
        const r = await rpc('admin_clear_data', { p_scope: 'all', p_confirm: 'CLEAR' });
        if(r.code!==0) return r;
        return { code:0, data: r.data };
      }
      default:
        return { code:1, msg:'未知操作：' + action };
    }
  }catch(e){
    return { code:1, msg:'操作失败：' + ((e && e.message) || e) };
  }
}

/* ---------- V2.0 后续里程碑会用到：直接调 RPC 的统一入口 ---------- */
async function rpcCall(name, args){ return await rpc(name, args); }

async function loadAppState(){
  const r = await rpc('get_app_state');
  if(r.code!==0) return r;
  const d = r.data || {};
  APP.me = d.me || null;
  APP.config = d.config || {};
  APP.period = d.period || {};
  APP.maintenance = !!(APP.period && APP.period.maintenance);
  APP.unread = d.unread || 0;
  APP.isSupervisor = !!(APP.me && APP.me.is_supervisor);
  if(APP.me && session && session.user){ session.user = Object.assign({}, session.user, { _id: APP.me.id, role: APP.me.role, name: APP.me.name, username: APP.me.username, group_name: APP.me.group_name, student_id: APP.me.student_id, is_supervisor: !!APP.me.is_supervisor }); }
  return { code:0, data: d };
}
async function refreshPeriodState(){
  const r = await rpc('get_period_state');
  if(r.code!==0) return r;
  APP.period = Object.assign({}, APP.period, r.data || {});
  APP.maintenance = !!APP.period.maintenance;
  renderPeriodBar();
  return { code:0, data: r.data };
}

async function fetchAllData(){
  const [s, r, rl, bd] = await Promise.all([
    sb.from('students').select('*'),
    sb.from('records').select('*'),
    sb.from('rules').select('*'),
    sb.from('boundaries').select('*').order('boundary_at', { ascending: false }),
  ]);
  if(s.error) return { code:1, msg:'加载学生失败：' + s.error.message };
  if(r.error) return { code:1, msg:'加载记录失败：' + r.error.message };
  if(rl.error) return { code:1, msg:'加载规则失败：' + rl.error.message };
  let users = [];
  // 用户列表（list_users）只对管理员开放；执行管理/记录员/学生不需要全量用户，用本人信息占位
  if(isAdmin()){
    const u = await rpc('list_users');
    if(u.code===0 && Array.isArray(u.data)) users = u.data.map(x=>({ _id:x.id, username:x.username, name:x.name, role:x.role, group_name:x.group_name||null, status:x.status, student_id:x.student_id||null, student_no:x.student_no||null, created_at:x.created_at||null, positions:x.positions||[] }));
    else if(u.code!==0) return { code:1, msg:'加载用户失败：' + u.msg };
  } else if(session && session.user){
    users = [session.user];
  }
  return { code:0, data: {
    users,
    students: mapRows(s.data),
    records: mapRows(r.data),
    rules: mapRows(rl.data),
    boundaries: mapRows(bd.error ? [] : bd.data),
  } };
}

/* ==========================================================
   数据查询辅助
========================================================== */
function getStudents(){ return DB.students; }
/* 小组排序：先按小组序号（第1组 → 第2组 → …），再按小组名，最后按姓名 */
function groupOrderKey(g){
  const t=String(g==null?'':g).trim();
  const m=t.match(/\d+/);
  return [m?parseInt(m[0],10):9999, t];
}
function cmpGroupName(a,b){
  const ka=groupOrderKey(a), kb=groupOrderKey(b);
  if(ka[0]!==kb[0]) return ka[0]-kb[0];
  return String(ka[1]).localeCompare(String(kb[1]),'zh');
}
function groupLabel(g){
  const t=String(g==null?'':g).trim();
  if(!t) return '未分小组';
  return /^\d+$/.test(t) ? ('第'+t+'小组') : t;
}
function sortStudentsByGroup(list){
  return (list||[]).slice().sort((a,b)=>cmpGroupName(a.group_name,b.group_name)||String(a.name||'').localeCompare(String(b.name||''),'zh'));
}
/* 生成按小组分组的 <option>（optgroup），selectedId 选中项，emptyLabel 追加“全部” */
function studentOptionsHtml(list, selectedId, emptyLabel){
  const arr=sortStudentsByGroup(list||DB.students||[]);
  const map=new Map();
  arr.forEach(s=>{
    const g=String(s.group_name==null?'':s.group_name).trim();
    if(!map.has(g)) map.set(g,[]);
    map.get(g).push(s);
  });
  const keys=[...map.keys()].sort(cmpGroupName);
  let html = emptyLabel? `<option value="">${esc(emptyLabel)}</option>` : '';
  keys.forEach(g=>{
    html += `<optgroup label="${esc(groupLabel(g))}">`;
    map.get(g).forEach(s=>{
      const sel = (selectedId!=null && selectedId!=='' && String(s._id)===String(selectedId)) ? ' selected' : '';
      html += `<option value="${esc(s._id)}"${sel}>${esc(s.name)}</option>`;
    });
    html += '</optgroup>';
  });
  return html || '<option value="">（暂无学生）</option>';
}
function getGroups(){ return [...new Set(DB.students.map(s=>s.group_name))].sort(); }
let STUDENT_INDEX={};
async function ensureStudentIndex(){
  const idx=Object.assign({}, STUDENT_INDEX);
  (DB.students||[]).forEach(s=>{ idx[s._id]={ name:s.name, group_name:s.group_name||'' }; });
  const missing=(DB.records||[]).some(r=>r.student_id && !idx[r.student_id]);
  if(missing || !Object.keys(idx).length){
    const r=await rpc('student_rankings', { p_scope:'all' });
    if(r.code===0 && r.data && Array.isArray(r.data.individuals)){
      r.data.individuals.forEach(x=>{ idx[x.student_id]={ name:x.name, group_name:x.group_name||'' }; });
    }
  }
  STUDENT_INDEX=idx;
  return idx;
}
function getStudentById(id){ return DB.students.find(s=>s._id===id) || STUDENT_INDEX[id] || null; }
function getUserById(id){ return DB.users.find(u=>u._id===id); }
function activeRecords(){ return DB.records.filter(r=>r.status!=='已删除'); }
function studentTotal(id){ return DB.records.filter(r=>r.student_id===id && r.status!=='已删除').reduce((s,r)=>s+(+r.points||0),0); }
function rulesByType(type){
  return DB.rules
    .filter(r=>r.score_type===type)
    .sort((a,b)=>(a.category===b.category ? (a.sort_order-b.sort_order) : 0))
    .reduce((m,r)=>{ (m[r.category]=m[r.category]||[]).push(r); return m; }, {});
}

/* ==========================================================

========================================================== */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; }
/* 兼容字符串 / Date / ISO：用于汇总里的时间字段显示 */
function fmtDay(v){
  if(!v) return '';
  if(v instanceof Date) return fmtDate(v);
  const d=new Date(v);
  return isNaN(d.getTime()) ? String(v) : fmtDate(d);
}
function todayStr(){ return fmtDate(new Date()); }
function monthsAgoStr(n){ const d=new Date(); d.setMonth(d.getMonth()-n); return fmtDate(d); }
function fmtDateTime(iso){
  if(!iso) return '';
  if(typeof iso === 'string' && !/^\d{4}-\d{2}-\d{2}/.test(iso)) return iso; // 后端已格式化的短串（如 10-31 18:36）直接显示
  try{ const d=new Date(iso); if(isNaN(d.getTime())) return String(iso);
    return `${fmtDate(d)} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }catch(e){ return String(iso); }
}
function fmtBeijingTime(iso){
  if(!iso) return '';
  try{
    const d=new Date(iso);
    if(isNaN(d.getTime())) return iso;
    const bj=new Date(d.getTime() + 8*60*60*1000);
    const y=bj.getUTCFullYear(), m=String(bj.getUTCMonth()+1).padStart(2,'0');
    const dd=String(bj.getUTCDate()).padStart(2,'0');
    const hh=String(bj.getUTCHours()).padStart(2,'0');
    const mm=String(bj.getUTCMinutes()).padStart(2,'0');
    return `${y}-${m}-${dd} ${hh}:${mm}`;
  }catch(e){ return iso; }
}
function ptsClass(v){ v=+v||0; return v>=0?'pos':'neg'; }
function pointsHtml(v){ return `<span class="${ptsClass(v)}">${v}</span>`; }

/* ---------- CSV / 文件下载 ---------- */
function downloadText(filename, text, mime){
  const blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function csvCell(v){
  if(v==null) return '';
  let s=String(v);
  if(/[",\r\n]/.test(s)) s='"'+s.replace(/"/g,'""')+'"';
  return s;
}
function toCSV(rows){
  if(!rows.length) return '';
  const headers=Object.keys(rows[0]);
  const lines=[headers.map(csvCell).join(',')];
  rows.forEach(r=>lines.push(headers.map(h=>csvCell(r[h])).join(',')));
  return '\uFEFF'+lines.join('\r\n');
}
function downloadCSV(filename, rows){
  if(!rows.length){ toast('没有数据可导出','err'); return; }
  downloadText(filename.endsWith('.csv')?filename:filename+'.csv', toCSV(rows), 'text/csv;charset=utf-8');
}
function downloadXLSX(filename, rows){
  if(!rows.length){ toast('没有数据可导出','err'); return; }
  if(typeof XLSX==='undefined'){ downloadCSV(filename, rows); toast('未加载 Excel 支持，已改为 CSV 导出'); return; }
  const ws=XLSX.utils.json_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
  const fname=filename.toLowerCase().endsWith('.xlsx')?filename:filename+'.xlsx';
  XLSX.writeFile(wb, fname);
}

/* ---------- CSV 解析 ---------- */
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; }
      else cell+=c;
    } else if(c==='"'){ q=true; }
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n' || c==='\r'){ if(!(c==='\r'&&text[i+1]==='\n')){ row.push(cell); rows.push(row); row=[]; cell=''; } }
    else cell+=c;
  }
  if(cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.length && !(r.length===1 && r[0].trim()===''));
}

/* ---------- 文件读取 ---------- */
function pickFile(accept, onLoad){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept=accept||'.csv,.txt,.xlsx,.xls';
  inp.onchange=()=>{ if(!inp.files.length) return; onLoad(inp.files[0]); };
  inp.click();
}
function readAsText(file, cb){
  const r=new FileReader();
  r.onload=()=>cb(r.result);
  r.readAsText(file, 'utf-8');
}
function readAsRows(file, cb){
  const name=file.name.toLowerCase();
  if(name.endsWith('.csv') || name.endsWith('.txt')){
    readAsText(file, t=>cb(parseCSV(t)));
  } else if(name.endsWith('.xlsx') || name.endsWith('.xls')){
    if(typeof XLSX==='undefined'){ toast('未加载 Excel 支持，请将文件另存为 CSV 后导入','err'); return; }
    const r=new FileReader();
    r.onload=()=>{
      try{
        const wb=XLSX.read(new Uint8Array(r.result), {type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const arr=XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''});
        cb(arr.map(r=>r.map(c=>String(c==null?'':c).trim())));
      }catch(e){ toast('读取 Excel 失败：'+e.message,'err'); }
    };
    r.readAsArrayBuffer(file);
  } else { toast('不支持的文件格式','err'); }
}

========================================================== */
async function doLogin(e){
  e.preventDefault();
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value;
  if(!u||!p){ toast('请输入账号和密码','err'); return false; }
  const email=toEmail(u);
  const { error } = await sb.auth.signInWithPassword({ email, password: p });
  if(error){ toast(loginErrorMsg(error),'err'); document.getElementById('loginPass').value=''; return false; }
  const st = await loadAppState();
  if(st.code!==0){ await sb.auth.signOut(); toast(st.msg,'err'); return false; }
  const me = APP.me;
  if(!me){ await sb.auth.signOut(); toast('未找到该用户信息，请联系管理员','err'); return false; }
  if(me.status==='pending'){ await sb.auth.signOut(); toast('账号正在等待老师审核，审核通过后即可登录','err'); return false; }
  if(me.status==='disabled'){ await sb.auth.signOut(); toast('账号已被停用，请联系老师','err'); return false; }
  session = {
    user: { _id:me.id, username:me.username, name:me.name, role:me.role, group_name:me.group_name||null, student_id:me.student_id||null },
    selectedGroup: null,
    mustChangePassword: !!me.must_change_password,
    isSupervisor: !!me.is_supervisor,
    _loginPass: p
  };
  rpc('log_login');
  if(session.mustChangePassword){ showPwdScreen(); return false; }
  await afterLoginData();
  return false;
}

async function afterLoginData(){
  const dd = await call('getData');
  if(dd.code!==0){ await sb.auth.signOut(); toast(dd.msg,'err'); return; }
  DB = dd.data;
  if(!isTeacher()) { try { await ensureStudentIndex(); } catch(e) {} }
  const meRow = DB.users.find(x=>x._id===session.user._id);
  if(meRow) session.user = Object.assign(session.user, meRow);
  session._loginPass = '';
  if(session.user.role==='group_recorder'){ showGroupSelect(); }
  else { enterApp(); }
}

function toEmail(u){
  if(u.indexOf('@')>0) return u.toLowerCase();
  return u.toLowerCase() + EMAIL_DOMAIN;
}
function loginErrorMsg(e){
  const m=(e && e.message) ? e.message : '';
  if(m.indexOf('Invalid login credentials')>=0) return '账号或密码错误';
  if(m.indexOf('Email not confirmed')>=0) return '账号未确认，请在 Supabase 控制台关闭邮箱验证后重试';
  return '登录失败：' + (m || '未知错误');
}

/* 侧栏分组（多级菜单）：页面按业务归组，空组自动隐藏 */
const NAV_GROUPS = [
  { title:'我的',         pages:['我的积分','我的汇总','我的星光'] },
  { title:'班级积分',     pages:['学生管理','积分登记','积分明细','积分汇总'] },
  { title:'奖惩与汇总',   pages:['奖惩抽选','我的仓库','周期汇总','仓库管理'] },
  { title:'消息',         pages:['通知信箱'] },
  { title:'管理等',       pages:['用户管理','星光台账','监督委员','数据管理','审计日志','积分规则','设置'] },
];
let _navCollapsed = (function(){ try{ return JSON.parse(localStorage.getItem('nav_collapsed')||'{}'); }catch(e){ return {}; } })();
function renderNav(){
  const nav=document.getElementById('sbNav');
  if(!nav) return;
  nav.innerHTML='';
  const pages=visiblePages();
  const used={};
  const groups=NAV_GROUPS.map(g=>({ title:g.title, pages:g.pages.filter(p=>pages.indexOf(p)>=0) })).filter(g=>g.pages.length);
  groups.forEach(g=>g.pages.forEach(p=>{ used[p]=1; }));
  const rest=pages.filter(p=>!used[p]);
  if(rest.length) groups.push({ title:'其他', pages:rest });
  groups.forEach(g=>{
    const wrap=document.createElement('div');
    wrap.className='nav-group'+(_navCollapsed[g.title]?' collapsed':'');
    const head=document.createElement('div');
    head.className='nav-group-title';
    head.innerHTML='<span>'+esc(g.title)+'</span><span class="nav-caret">▾</span>';
    head.onclick=function(){
      _navCollapsed[g.title]=!_navCollapsed[g.title];
      wrap.classList.toggle('collapsed');
      try{ localStorage.setItem('nav_collapsed', JSON.stringify(_navCollapsed)); }catch(e){}
    };
    wrap.appendChild(head);
    const box=document.createElement('div');
    box.className='nav-group-items';
    g.pages.forEach(function(p){
      const b=document.createElement('button');
      b.className='nav-item sub'+(p===currentPage?' active':'');
      b.innerHTML='<span>'+esc(p)+'</span>'+(p==='通知信箱'?'<span class="nav-badge hidden" id="navUnread"></span>':'');
      b.onclick=function(){ navigate(p); closeSidebar(); };
      box.appendChild(b);
    });
    wrap.appendChild(box);
    nav.appendChild(wrap);
  });
  renderUnreadBadge();
}

  if(fn) fn(); else document.getElementById('page').innerHTML = `${pageHeader(page)}<div class="card dim">该页面正在开发中（V2.0 后续里程碑）。</div>`;
  setTimeout(fitTableWraps, 60);
}

/* V2.0.6：让每个表格容器的高度随可视区自适应，横向滚动条始终可见（不用滑到页面底部） */
function fitTableWraps(){
  const page=document.getElementById('page');
  if(!page) return;
  const avail=window.innerHeight - 24;
  page.querySelectorAll('.table-wrap').forEach(w=>{
    const top=w.getBoundingClientRect().top;
    const h=Math.max(160, avail - top);
    w.style.maxHeight = h + 'px';
  });
}
window.addEventListener('resize', ()=>setTimeout(fitTableWraps, 120));

/* ==========================================================
   周期状态条 / 维护提示 / 倒计时
========================================================= */
let _clockOffset = 0;       // 服务器时间 - 本地时间（毫秒）
let _periodTick = 0;

function serverNow(){ return Date.now() + _clockOffset; }
function fmtCountdown(ms){
  if(ms==null || isNaN(ms) || ms<0) ms = 0;
  const s=Math.floor(ms/1000);
  const d=Math.floor(s/86400), h=Math.floor((s%86400)/3600), m=Math.floor((s%3600)/60), sec=s%60;
  if(d>0) return `${d}天${h}小时`;
  if(h>0) return `${h}小时${String(m).padStart(2,'0')}分`;
  return `${m}分${String(sec).padStart(2,'0')}秒`;
}
function renderPeriodBar(){
  const el=document.getElementById('periodBar');
  if(!el) return;
  const p=APP.period||{};
  const parts=[];
  const _m=(s)=>{const a=String(s||'').split('-');return a.length===3?(a[1]+'-'+a[2]):String(s||'');};
  const _bd=(type,key)=>(DB.boundaries||[]).find(b=>b.type===type && String(b.period_key)===String(key));
  if(p.week_key){const b=_bd('week',p.week_key);parts.push(`<span class="pill pill-week" title="当前周（起止日期）">周 ${esc(b?(_m(b.start_date)+'~'+_m(b.end_date)):p.week_key)}</span>`);}
  if(p.month_key){const b=_bd('month',p.month_key);parts.push(`<span class="pill pill-month" title="当前月（起止日期）">月 ${esc(b?(_m(b.start_date)+'~'+(b.end_date?_m(b.end_date):'今日')):p.month_key)}</span>`);}
  parts.push(`<span class="pill dim" title="系统不自动结算，由管理员手动触发">手动结算</span>`);
  if(APP.maintenance) parts.push(`<span class="pill pill-danger">维护中</span>`);
  el.innerHTML = parts.join('');

  const banner=document.getElementById('maintenanceBanner');
  if(banner){
    if(APP.maintenance){
      const until=p.maintenance_until ? fmtDateTime(p.maintenance_until) : '';
      banner.innerHTML = `<span>⚠ 系统正在月度结算维护，全站只读。</span><span class="dim">${until?('预计 '+esc(until)+' 恢复'):''}</span>`;
      banner.classList.remove('hidden');
    } else {
      banner.classList.add('hidden');
      banner.innerHTML='';
    }
  }
}
function startPeriodTimer(){
  stopPeriodTimer();
  renderPeriodBar();
  _periodTimer = setInterval(async ()=>{
    renderPeriodBar();
    _periodTick++;
    // 每 30 秒与服务端对齐一次（跨日/跨分隔点/维护状态变化）
    if(_periodTick % 30 === 0){
      const prevMaint = APP.maintenance, prevWeek = (APP.period||{}).week_key, prevMonth = (APP.period||{}).month_key;
      const r = await refreshPeriodState();
      if(r.code===0){
        const weekChanged = prevWeek !== (APP.period||{}).week_key;
        const monthChanged = prevMonth !== (APP.period||{}).month_key;
        if(prevMaint !== APP.maintenance || weekChanged || monthChanged){
          if(session && session.user) await reloadData(true);
        }
      }
    }
  }, 1000);
}
function stopPeriodTimer(){ if(_periodTimer){ clearInterval(_periodTimer); _periodTimer=null; } }

async function addStudent(){

async function saveStudent(id){
  const s=getStudentById(id); if(!s) return;
  const name=document.getElementById('eStuName').value.trim();
  const group=document.getElementById('eStuGroup').value.trim();
  const no=document.getElementById('eStuNo').value.trim()||null;
  if(!name||!group){ toast('姓名和小组不能为空','err'); return; }
  const r=await call('updateStudent', { token, _id:id, name, group_name:group, student_no:no });

function deleteStudent(id){
  if(!Array.isArray(id)) id=[id];
  confirmDialog('确认删除','确定要删除选中的 '+id.length+' 名学生吗？相关积分记录将保留但不再关联。', async ()=>{
    const r=await call('deleteStudents', { token, ids:id });
    if(r.code!==0){ toast(r.msg,'err'); return; }
    DB.students=DB.students.filter(s=>!id.includes(s._id));
    renderStudents(); toast('已删除 '+id.length+' 名学生','ok');
  });

  const ids=selectedStudentIds();

  openModal(`

async function saveBatchEdit(){
  const g=document.getElementById('batchGroup').value.trim();
  if(!g){ toast('小组名不能为空','err'); return; }
  const ids=selectedStudentIds();
  for(const id of ids){
    const s=getStudentById(id);
    const r=await call('updateStudent', { token, _id:id, name:s.name, group_name:g, student_no:s.student_no });
    if(r.code!==0){ toast(r.msg,'err'); return; }
    s.group_name=g;
  }
  closeModal(); renderStudents(); toast('已更新 '+ids.length+' 名学生的小组','ok');
}
function batchDeleteStudents(){
  const ids=selectedStudentIds();
  if(!ids.length){ toast('请先勾选要删除的学生','err'); return; }
  deleteStudent(ids);
}
function importStudentsFile(){
  pickFile('.csv,.txt,.xlsx,.xls', file=>{
    readAsRows(file, async rows=>{
      let body=rows.slice(1);
      if(!body.length){ body=rows; }
      const payload=[]; let errs=0;
      body.forEach(r=>{
        if(r.length<2){ errs++; return; }
        let no,name,group;
        if(r.length>=3){ no=r[0]||null; name=r[1]; group=r[2]; }
        else { no=null; name=r[0]; group=r[1]; }
        if(!name||!group){ errs++; return; }
        payload.push({ name, group_name:group, student_no:no });
      });
      if(!payload.length){ toast('文件中没有可导入的学生数据','err'); return; }
      const r=await call('importStudents', { token, rows:payload });
      if(r.code!==0){ toast(r.msg,'err'); return; }
      const dd=await call('getData', { token });
      if(dd.code===0) DB=dd.data;
      renderStudents();
      toast('成功导入 '+r.count+' 名学生'+(errs?'，跳过 '+errs+' 条无效记录':''), r.count?'ok':'err');
    });
  });
}

/* 规则上限的“本周期”起点：数据库按最近一次 week / rule_update / month 分隔点计算 */
function limitPeriodStart(){
  const now=Date.now(); let start=null;
  (DB.boundaries||[]).forEach(b=>{
    if(!b || (b.type!=='week' && b.type!=='rule_update' && b.type!=='month')) return;
    const t=new Date(b.boundary_at).getTime();
    if(!isFinite(t) || t>now) return;
    if(start===null || t>start) start=t;
  });
  if(start===null) return null;
  const d=new Date(start+8*3600e3);
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
}
/* 规则上限用量：按“被登记的学生”统计（与数据库 check_rule_limit 口径一致） */
function ruleUsage(rule, studentId){
  if(!rule || !rule.limit_type || rule.limit_type==='none' || !(+rule.limit_value>0)) return null;
  const sel=document.getElementById('scStudent');
  const sid=studentId || (sel?sel.value:'');
  if(!sid) return null;
  const start=limitPeriodStart();
  const used=DB.records.filter(x=>x.status==='正常' && x.rule_id===rule._id && x.student_id===sid &&
      (!start || (x.record_date && String(x.record_date)>=start)))
    .reduce((acc,x)=>acc+((rule.limit_type==='points')?Math.abs(+x.points||0):1),0);
  const limit=+rule.limit_value;
  return `该生本周期已用 ${used} / 上限 ${limit}${used>=limit?'（已达上限）':''}`;
}
function currentScoreRule(){
  const t=document.getElementById('scType').value;
  const c=document.getElementById('scCategory').value;
  const reason=document.getElementById('scReason').value;
  const map=rulesByType(t);
  return (map[c]||[]).find(x=>x.reason===reason) || null;
}
let _calYear=0, _calMonth=0;
function pickScoreDate(){
  const cur=(document.getElementById('scDate').value)||todayStr();
  const parts=cur.split('-').map(Number);
  _calYear=parts[0]; _calMonth=(parts[1]||1)-1;
  renderCalendar();
}
function renderCalendar(){
  const today=todayStr();
  const lockedBefore=(APP.period && APP.period.locked_before_date) || null;   // 早于此日期=已冻结月份
  const sel=document.getElementById('scDate').value;
  const daysInMonth=new Date(_calYear,_calMonth+1,0).getDate();
  const startDow=new Date(_calYear,_calMonth,1).getDay();
  let cells='';
  for(let i=0;i<startDow;i++) cells+='<span class="cal-cell cal-empty"></span>';
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${_calYear}-${String(_calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let cls='cal-cell';
    const isFuture = ds>today;
    const isFrozen = lockedBefore && ds<lockedBefore;
    if(ds===sel) cls+=' cal-sel';
    else if(ds===today) cls+=' cal-today';
    if(isFuture || isFrozen){
      cells+=`<button type="button" class="${cls}" disabled title="${isFuture?'不能登记未来日期':'该月份已冻结'}" style="opacity:.35;cursor:not-allowed">${d}</button>`;
    } else {
      cells+=`<button type="button" class="${cls}" onclick="pickCalendarDay('${ds}')">${d}</button>`;
    }
  }
  openModal(`
    <h3>选择日期</h3>
    ${lockedBefore?`<p class="modal-msg">早于 ${esc(lockedBefore)} 的日期属于已冻结月份，不可登记。</p>`:''}
    <div class="cal-head">
      <button class="btn btn-ghost btn-mini" onclick="calShift(-1)">‹ 上月</button>
      <div class="cal-title">${_calYear}年${_calMonth+1}月</div>
      <button class="btn btn-ghost btn-mini" onclick="calShift(1)">下月 ›</button>
    </div>
    <div class="cal-grid cal-week">${['日','一','二','三','四','五','六'].map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button></div>`);
}
function calShift(delta){
  _calMonth+=delta;
  if(_calMonth<0){ _calMonth=11; _calYear--; }
  else if(_calMonth>11){ _calMonth=0; _calYear++; }
  renderCalendar();
}
function pickCalendarDay(ds){
  document.getElementById('scDate').value=ds;
  document.getElementById('scDateText').textContent=ds;
  closeModal();
}
function onScoreDateChange(){
  const v=document.getElementById('scDate').value;
  document.getElementById('scDateText').textContent=v||todayStr();
}
async function submitScore(){
  const studentId=document.getElementById('scStudent').value;
  if(!studentId){ toast('请先选择学生','err'); return; }
  const score_type=document.getElementById('scType').value;
  const category=document.getElementById('scCategory').value;
  const reason=document.getElementById('scReason').value;
  if(!category||!reason){ toast('请选择分类与原因','err'); return; }
  const points=parseFloat(document.getElementById('scPoints').value);
  if(isNaN(points)){ toast('请输入有效的分值','err'); return; }
  const record_date=document.getElementById('scDate').value||todayStr();
  if(record_date>todayStr()){ toast('不能登记未来日期','err'); return; }
  if(APP.period && APP.period.locked_before_date && record_date<APP.period.locked_before_date){
    toast('该月份已结算冻结，不能再登记；如需纠正请联系管理员','err'); return;
  }
  const evidence=document.getElementById('scRemark').value.trim()||null;
  const rule=currentScoreRule();
  const r=await call('addRecord', { token, student_id:studentId, score_type, category, reason, points, record_date, evidence, rule_id: rule?rule._id:null });
  if(r.code!==0){ toast(r.msg,'err'); return; }
  DB.records.push(r.doc);
  document.getElementById('scRemark').value='';
  const usage=ruleUsage(rule, studentId);
  toast('积分登记成功' + (usage?('　' + usage):''),'ok');
  onScoreReasonChange();
}

function recordFrozen(r){ return !!(r && r.frozen_until && new Date(r.frozen_until).getTime() > serverNow()); }
function freezeLeftSec(r){
  if(!r || !r.frozen_until) return 0;
  return Math.max(0, Math.ceil((new Date(r.frozen_until).getTime() - serverNow())/1000));
}
function startFreezeTicker(){
  if(window._freezeTimer) return;
  window._freezeTimer = setInterval(()=>{
    const els=document.querySelectorAll('[data-freeze-until]');
    if(!els.length){ clearInterval(window._freezeTimer); window._freezeTimer=null; return; }
    els.forEach(el=>{
      const left=Math.ceil((new Date(el.getAttribute('data-freeze-until')).getTime()-serverNow())/1000);
      if(left>0){ el.textContent='写入保护中 '+left+'s'; }
      else { el.textContent=''; el.classList.add('hidden'); }
    });
  }, 1000);
}
function queryDetail(){
  const studentId=document.getElementById('dStudent').value||null;
  const start=document.getElementById('dStart').value;
  const end=document.getElementById('dEnd').value;
  let recs=DB.records.slice();
  if(studentId) recs=recs.filter(r=>r.student_id===studentId);
  if(start) recs=recs.filter(r=>r.record_date>=start);
  if(end) recs=recs.filter(r=>r.record_date<=end);
  if(detailSortKey==='created_at'){
    recs.sort((a,b)=> String(b.created_at||'').localeCompare(String(a.created_at||'')) || (b.record_date||'').localeCompare(a.record_date||''));
  } else {
    recs.sort((a,b)=> (b.record_date||'').localeCompare(a.record_date||'') || String(b.created_at||'').localeCompare(String(a.created_at||'')));
  }
  const canEdit=isTeacher()||isRecorder();
  const body=document.getElementById('dBody');
  if(!recs.length){ body.innerHTML=`<tr><td colspan="${canEdit?12:11}" class="empty">没有符合条件的记录</td></tr>`; return; }
  body.innerHTML=recs.map(r=>{
    const stu=getStudentById(r.student_id); const recUser=getUserById(r.recorder_id);
    let modInfo='';
    if(r.modified_by && r.modified_at){
      const mod=getUserById(r.modified_by);
      const mn=r.modified_by_name||(mod?mod.name:null)||'历史账号';
      modInfo=`<span class="neg">由${esc(mn)}于${esc(fmtBeijingTime(r.modified_at))}${r.status==='已删除'?'删除':'修改'}</span>`;
    }
    let opCell='';
    if(canEdit){
      if(r.status==='已删除'){
        opCell='<span class="dim">已删除</span>';
      } else if(recordFrozen(r)){
        opCell=`<span class="freeze-hint" data-freeze-until="${esc(r.frozen_until)}">写入保护中 ${freezeLeftSec(r)}s</span>`;
      } else {
        opCell=`<div class="row-actions"><button class="btn btn-mini btn-primary" onclick="editRecord('${esc(r._id)}')">编辑</button><button class="btn btn-mini btn-outline-danger" onclick="deleteRecord('${esc(r._id)}')">删除</button></div>`;
      }
    }
    return `<tr>
      <td>${esc(r.record_date)}</td>
      <td>${esc(r.created_at?fmtBeijingTime(r.created_at):'')}</td>
      <td>${esc(stu?stu.name:r.student_id)}</td>
      <td>${esc(stu?stu.group_name:'')}</td>
      <td>${esc(r.score_type)}</td>
      <td>${esc(r.category)}</td>
      <td>${esc(r.reason)}</td>
      <td>${pointsHtml(r.points)}</td>
      <td>${esc(r.recorder_name||(recUser?recUser.name:'')||'—')}</td>
      <td>${esc(r.evidence||'')}</td>
      <td>${modInfo}</td>
      ${opCell?`<td>${opCell}</td>`:''}
    </tr>`;
  }).join('');
  startFreezeTicker();
}
function editRecord(id){
  const r=DB.records.find(x=>x._id===id); if(!r) return;
  if(r.status==='已删除'){ toast('该记录已被删除，无法编辑','err'); return; }
  if(recordFrozen(r)){ toast('该记录刚写入，处于 2 秒锁定中，请稍后再改','err'); return; }
  if(APP.maintenance){ toast('系统月度结算维护中，暂时不能修改','err'); return; }
  const locked=(APP.period && APP.period.locked_before_date)||null;
  if(locked && r.record_date && r.record_date<locked){ toast('该记录属于已冻结月份，不能修改','err'); return; }
  openModal(`
    <h3>编辑积分记录</h3>
    <p class="modal-msg">学生：${esc(getStudentById(r.student_id)?.name||'')} ｜ 日期：${esc(r.record_date)} ｜ 类型：${esc(r.score_type)}</p>
    <div class="modal-field"><label>原因</label><input class="field" id="eReason" value="${esc(r.reason)}"></div>
    <div class="modal-field"><label>分值</label><input class="field" id="ePoints" type="number" step="any" value="${r.points}"></div>
    <div class="modal-field"><label>备注</label><input class="field" id="eEvidence" value="${esc(r.evidence||'')}"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveRecord('${esc(id)}')">保存</button>
    </div>`);
}
async function saveRecord(id){
  const r=DB.records.find(x=>x._id===id); if(!r) return;
  const reason=document.getElementById('eReason').value.trim();
  const points=parseFloat(document.getElementById('ePoints').value);
  const evidence=document.getElementById('eEvidence').value.trim()||null;
  if(!reason){ toast('原因不能为空','err'); return; }
  if(isNaN(points)){ toast('请输入有效的分值','err'); return; }
  const rr=await call('updateRecord', { token, _id:id, reason, points, evidence });
  if(rr.code!==0){ toast(rr.msg,'err'); return; }
  const doc=rr.data;
  if(doc && doc.id){
    Object.assign(r, mapRow(doc));
  } else {
    r.reason=reason; r.points=points; r.evidence=evidence;
    r.modified_by=session.user._id; r.modified_at=new Date().toISOString();
    if(r.frozen_until) r.frozen_until=new Date(Date.now()+2000).toISOString();
  }
  closeModal(); queryDetail(); toast('积分记录已更新','ok');
}
function deleteRecord(id){
  const r=DB.records.find(x=>x._id===id); if(!r) return;
  if(r.status==='已删除'){ toast('该记录已被删除','err'); return; }
  if(recordFrozen(r)){ toast('该记录刚写入，处于 2 秒锁定中，请稍后再删','err'); return; }
  if(APP.maintenance){ toast('系统月度结算维护中，暂时不能删除','err'); return; }
  const locked=(APP.period && APP.period.locked_before_date)||null;
  if(locked && r.record_date && r.record_date<locked){ toast('该记录属于已冻结月份，不能删除','err'); return; }
  const stu=getStudentById(r.student_id);
  confirmDialog('确认删除',`确定要删除 ${stu?stu.name:''} 的这条积分记录吗？\n分值: ${r.points}\n原因: ${r.reason}`, async ()=>{
    const rr=await call('deleteRecord', { token, _id:id });
    if(rr.code!==0){ toast(rr.msg,'err'); return; }
    r.status='已删除'; r.modified_by=session.user._id; r.modified_at=new Date().toISOString();
    queryDetail(); toast('积分记录已删除','ok');
  });
}

function assignRank(list, key){
  list.forEach((r,i)=>{ r.rank=(i>0 && list[i-1][key]===r[key])?list[i-1].rank:i+1; });
}
function refreshSummary(){
  const start=document.getElementById('sStart').value;
  const end=document.getElementById('sEnd').value;
  const mode=document.getElementById('sMode').value;
  if(start>end){ toast('开始日期不能晚于结束日期','err'); return; }
  const days=Math.round((new Date(end)-new Date(start))/86400000)+1;
  document.getElementById('sHint').textContent=`统计范围：${start} 至 ${end}（共 ${days} 天）`;
  const head=document.getElementById('sHead'); const body=document.getElementById('sBody');
  if(mode==='student'){
    head.innerHTML='<tr><th>排名</th><th>姓名</th><th>小组</th><th>积分</th></tr>';
    const list=getStudents().map(s=>({ _id:s._id, name:s.name, group_name:s.group_name, total:0 }))
      .sort((a,b)=>a.group_name.localeCompare(b.group_name)||a.name.localeCompare(b.name));
    DB.records.filter(r=>r.status!=='已删除' && r.record_date>=start && r.record_date<=end)
      .forEach(r=>{ const s=list.find(x=>x._id===r.student_id); if(s) s.total+= (+r.points||0); });
    list.sort((a,b)=>b.total-a.total);
    assignRank(list,'total');
    body.innerHTML=list.map(r=>`<tr><td>${r.rank}</td><td>${esc(r.name)}</td><td>${esc(r.group_name)}</td><td class="${ptsClass(r.total)}">${r.total}</td></tr>`).join('')
      || '<tr><td colspan="4" class="empty">暂无学生</td></tr>';
  } else {
    head.innerHTML='<tr><th>排名</th><th>小组</th><th>积分</th></tr>';
    const groups=getGroups();
    const list=groups.map(g=>({ group_name:g, total:0 }));
    DB.records.filter(r=>r.status!=='已删除' && r.record_date>=start && r.record_date<=end)
      .forEach(r=>{ const g=list.find(x=>x.group_name===getStudentById(r.student_id)?.group_name); if(g) g.total+=(+r.points||0); });
    list.sort((a,b)=>b.total-a.total);
    assignRank(list,'total');
    body.innerHTML=list.map(r=>`<tr><td>${r.rank}</td><td>${esc(r.group_name)}</td><td class="${ptsClass(r.total)}">${r.total}</td></tr>`).join('')
      || '<tr><td colspan="3" class="empty">暂无小组</td></tr>';
  }
}

async function addUser(){
  const username=document.getElementById('uUsername').value.trim();
  const password=document.getElementById('uPassword').value;
  const name=document.getElementById('uName').value.trim();
  const role=document.getElementById('uRole').value;
  const group=document.getElementById('uGroup').value.trim()||null;
  const forceEl=document.getElementById('uForce');
  const force=forceEl?!!forceEl.checked:true;
  if(!username||!password||!name){ toast('请填写完整信息','err'); return; }
  const r=await rpc('admin_create_user', { p_username:username, p_password:password, p_name:name, p_role:role, p_group:group, p_force_change:force });
  if(r.code!==0){ toast(r.msg,'err'); return; }
  // 职务标签（可选）：保存账号后单独写入
  const pos = collectAddPositions();
  const newId = (r.data && r.data.id) ? r.data.id : null;
  if(pos.length && newId){
    const pr = await rpc('admin_set_user_positions', { p_id:newId, p_positions:pos });
    if(pr.code!==0) toast('账号已建，但职务标签保存失败：'+(pr.msg||''),'err');
  }
  await reloadData(false); renderUsers(); toast('用户添加成功','ok');
}
function onAddRoleChange(){
  const role=(document.getElementById('uRole')||{}).value;
  const box=document.getElementById('uPosBox');
  if(!box) return;
  // 学生账号不显示职务标签（学生用“学生管理/批量建号”）
  box.style.display = (role==='student') ? 'none' : '';
  const lb=document.getElementById('uPosLabel');
  if(lb) lb.style.display = (role==='student') ? 'none' : '';

function collectAddPositions(){
  const arr=[];
  document.querySelectorAll('.uPosChk:checked').forEach(function(c){ arr.push(c.value); });
  const custom=((document.getElementById('uPosCustom')||{}).value||'').trim();
  if(custom) arr.push(custom);

function openPositions(id){
  const u=getUserById(id); if(!u) return;
  const cur=u.positions||[];
  const presets=['团支书','班长','纪律委员'];
  const extra=cur.filter(function(p){ return presets.indexOf(p)<0; });
  openModal('<h3>职务标签 - '+esc(u.name)+'</h3>'
    +'<div class="desc" style="margin-bottom:8px">可多选；仅作展示与筛选，不影响权限。自定义标识用逗号分隔。</div>'
    +presets.map(function(p){ return '<label class="pos-chk"><input type="checkbox" class="posChk" value="'+esc(p)+'"'+(cur.indexOf(p)>=0?' checked':'')+'>'+esc(p)+'</label>'; }).join('')
    +'<div class="modal-field" style="margin-top:10px"><label>自定义标识</label><input class="field" id="posCustom" placeholder="例如：卫生委员，可留空" value="'+esc(extra.join('，'))+'"></div>'
    +'<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button>'
    +'<button class="btn btn-primary" onclick="savePositions(\''+esc(id)+'\')">保存</button></div>');
}
async function savePositions(id){
  const arr=[];
  document.querySelectorAll('.posChk:checked').forEach(function(c){ arr.push(c.value); });
  const custom=((document.getElementById('posCustom')||{}).value||'').trim();
  if(custom){
    custom.split(/[，,、\s]+/).forEach(function(x){ x=x.trim(); if(x && arr.indexOf(x)<0) arr.push(x); });
  }
  const r=await rpc('admin_set_user_positions',{ p_id:id, p_positions:arr });
  if(r.code!==0){ toast(r.msg,'err'); return; }
  closeModal(); await reloadData(false); renderUsers(); toast('职务标签已保存','ok');
}

/* ----- 文件读取（CSV / Excel） ----- */
function readTableFile(file, cb){
  if(!file) return;
  const isXlsx=/(\.xlsx|\.xls)$/i.test(file.name);
  const reader=new FileReader();
  reader.onload=function(){
    try{
      let rows=[];
      if(isXlsx){
        if(typeof XLSX==='undefined'){ toast('Excel 解析组件未加载，请另存为 CSV 再导入','err'); return; }
        const wb=XLSX.read(new Uint8Array(reader.result),{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});
      }else{
        rows=parseCSV(String(reader.result||''));
      }
      rows=(rows||[]).filter(r=>Array.isArray(r) && r.some(c=>String(c==null?'':c).trim()!==''));
      if(!rows.length){ toast('文件里没有可识别的数据','err'); return; }
      cb(rows);
    }catch(e){ toast('解析文件失败：'+(e&&e.message||e),'err'); }
  };
  reader.onerror=function(){ toast('读取文件失败','err'); };
  if(isXlsx) reader.readAsArrayBuffer(file); else reader.readAsText(file,'utf-8');
}
function rowsToObjects(rows){
  const head=((rows[0]||[])).map(h=>String(h==null?'':h).trim());
  return rows.slice(1).map(r=>{
    const o={};
    head.forEach((h,i)=>{ if(h) o[h]=String(r[i]==null?'':r[i]).trim(); });
    return o;
  }).filter(o=>Object.keys(o).some(k=>o[k]!==''));
}
function downloadTemplate(name, headers, samples){
  const lines=[headers.map(csvCell).join(',')];
  (samples||[]).forEach(r=>lines.push(headers.map(h=>csvCell(r[h]||'')).join(',')));
  downloadText(name, '\uFEFF'+lines.join('\r\n'), 'text/csv;charset=utf-8');
}
function importPreviewHtml(rows, cols){
  if(!rows || !rows.length) return '<div class="dim small">尚未选择文件。可先下载模板，按表头填好再导入。</div>';
  const head=cols || Object.keys(rows[0]);
  const take=rows.slice(0,5);
  return `<div class="table-wrap imp-preview"><table class="data data-compact">
    <thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${take.map(r=>`<tr>${head.map(h=>`<td>${esc(r[h]||'')}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div><div class="dim small">共 ${rows.length} 行（只预览前 5 行）。</div>`;
}
function importErrorsHtml(errors, note){
  const list=(errors||[]).slice(0,30);
  if(!list.length) return '<div class="dim small">没有发现错误。</div>';
  return `<div class="dim small">${esc(note||'以下是前 30 条问题：')}</div>
    <ul class="dim small" style="max-height:200px;overflow:auto;margin:6px 0 0 18px">${list.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`;
}

async function whMarkCards(status){
  const ids=Array.from(document.querySelectorAll('#whBody input[type=checkbox]:checked')).map(cb=>cb.value);
  Object.keys(_whSel).forEach(k=>{ _whSel[k]=ids.indexOf(k)>=0; });
  if(!ids.length){ toast('请先勾选要处理的卡片','err'); return; }
  const label=status==='used'?'标记已使用':(status==='void'?'作废':'标记已过期');
  if(status==='void' && !isAdmin()){ toast('只有管理员或班主任可以作废卡片','err'); return; }
  if(status==='void'){
    // 已使用 / 已过期 / 已即时生效的卡片不能作废，只保留未使用的
    const byId={};
    ((_whCache&&_whCache.students)||[]).forEach(s=>(s.cards||[]).forEach(c=>{ byId[c.id]=c; }));
    const voidable=ids.filter(id=>byId[id]&&byId[id].status==='unused');
    const blocked=ids.length-voidable.length;
    if(!voidable.length){
      toast('选中的 '+ids.length+' 张卡片都不是「未使用」状态，不能作废（已使用/已过期/已生效的卡片不可作废）','err');
      return;
    }
    if(blocked){
      toast('已跳过 '+blocked+' 张（已使用/已过期/已生效的卡片不能作废）','warn');
      ids.length=0; voidable.forEach(id=>ids.push(id));
      _whSel={}; voidable.forEach(id=>{ _whSel[id]=1; });
      const el=document.getElementById('whSelCount'); if(el) el.textContent='已选 '+voidable.length+' 张';
    }
  }
  confirmDialog(label, '将对选中的 '+ids.length+' 张卡片执行「'+label+'」，确定继续吗？', async ()=>{
    const r=await rpc('admin_batch_mark_cards',{ p_draw_ids:ids, p_status:status, p_note:label+'（批量）' });
    if(r.code!==0){ toast(r.msg,'err'); return; }
    const d=r.data||{};

    toast('完成：成功 '+(d.ok||0)+' 张'+(d.skipped?'，跳过 '+(d.skipped||0)+' 张':''),'ok');
    if((d.errors||[]).length) console.warn('批量处理跳过原因', d.errors);
  });
}

async function submitGrantCards(){
  const itemEl=document.getElementById('grantItem');
  if(!itemEl||!itemEl.value){ toast('请选择要发放的卡片','err'); return; }
  const noteEl=document.getElementById('grantNote');
  const note=noteEl&&noteEl.value.trim()?noteEl.value.trim():null;
  const args={ p_pool_type:_grantPool, p_item_id:itemEl.value };
  if(_grantScope==='group'){
    const gEl=document.getElementById('grantGroup');
    if(!gEl||!gEl.value){ toast('请选择小组','err'); return; }
    args.p_group_name=gEl.value;
  }else{
    const ids=Object.keys(_grantStuSel).filter(k=>_grantStuSel[k]);
    if(!ids.length){ toast('请至少勾选 1 名学生','err'); return; }
    args.p_student_ids=ids;
  }
  if(note) args.p_note=note;
  const r=await rpc('admin_grant_cards',args);
  if(r.code!==0){ toast(r.msg,'err'); return; }
  const d=r.data||{};
  closeModal();
  toast('已发放 '+d.count+' 张「'+(d.item_title||'')+'」','ok');
  await renderWarehouse();
}

function restoreBackupFile(ev){
  const f=ev.target.files && ev.target.files[0];
  ev.target.value='';
  if(!f) return;
  const reader=new FileReader();
  reader.onload=function(){
    let data=null;
    try{ data=JSON.parse(String(reader.result||'')); }catch(e){ toast('备份文件不是合法 JSON','err'); return; }
    confirmDialog('恢复备份','将用备份文件覆盖当前全部业务数据（账号与密码不受影响），确定继续吗？', async ()=>{
      const r=await call('restoreBackup',{ token, data });
      if(r.code!==0){ toast(r.msg,'err'); return; }
      await reloadData(false); renderExport(); toast('备份已恢复','ok');
    });
  };
  reader.readAsText(f,'utf-8');
}
function exportData(type){
  if(type==='student_scores'){
    const data=getStudents().map(s=>({'学号':s.student_no||'-','姓名':s.name,'小组':s.group_name,'总积分':studentTotal(s._id)}));
    data.sort((a,b)=>b['总积分']-a['总积分']);
    downloadXLSX('学生总积分表.xlsx', data);
  } else if(type==='score_records'){
    const data=DB.records.slice().sort((a,b)=>{
      const aa=String(a.created_at||''), bb=String(b.created_at||''); return bb.localeCompare(aa);
    }).map(r=>({'日期':r.record_date,'学生':getStudentById(r.student_id)?.name||'','小组':getStudentById(r.student_id)?.group_name||'','类型':r.score_type,'分类':r.category,'原因':r.reason,'分值':r.points,'记录人':getUserById(r.recorder_id)?.name||'','备注':r.evidence||''}));
    downloadXLSX('积分明细表.xlsx', data);
  } else if(type==='group_scores'){
    const groups=getGroups();
    const data=groups.map(g=>({ '小组':g, '总积分': activeRecords().filter(r=>getStudentById(r.student_id)?.group_name===g).reduce((s,r)=>s+(+r.points||0),0) }));
    data.sort((a,b)=>b['总积分']-a['总积分']);
    downloadXLSX('小组积分表.xlsx', data);
  } else if(type==='ranking'){
    const data=getStudents().map(s=>({'姓名':s.name,'小组':s.group_name,'总积分':studentTotal(s._id)}));
    data.sort((a,b)=>b['总积分']-a['总积分']);
    data.forEach((d,i)=>d['排名']=(i>0 && data[i-1]['总积分']===d['总积分'])?data[i-1]['排名']:i+1);
    const ordered=data.map(d=>({'排名':d['排名'],'姓名':d['姓名'],'小组':d['小组'],'总积分':d['总积分']}));
    downloadXLSX('积分排名表.xlsx', ordered);
  }
}

    reason:document.getElementById('rReason').value.trim(),

async function saveNewRule(){

  if(!d.category||!d.reason){ toast('请填写分类和原因','err'); return; }

  if(d.limit_type!=='none' && d.limit_value<=0){ toast('请填写大于 0 的周期上限','err'); return; }
  const r=await call('addRule', { token, ...d });

}
async function saveEditRule(id){
  const d=readRuleForm();
  if(!d.category||!d.reason){ toast('请填写分类和原因','err'); return; }
  if(isNaN(d.points)){ toast('请输入有效的分值','err'); return; }
  if(d.limit_type!=='none' && d.limit_value<=0){ toast('请填写大于 0 的周期上限','err'); return; }
  const r=await call('updateRule', { token, _id:id, ...d });
  if(r.code!==0){ toast(r.msg,'err'); return; }
  const rule=DB.rules.find(x=>x._id===id);

function deleteRule(id){
  confirmDialog('确认','确定要删除该规则吗？', async ()=>{
    const r=await call('deleteRule', { token, _id:id });
    if(r.code!==0){ toast(r.msg,'err'); return; }
    DB.rules=DB.rules.filter(r=>r._id!==id);
    renderRules(); toast('规则已删除','ok');
  });
}
function exportRules(){
  const rules=DB.rules.slice().sort((a,b)=>{
    const ta=a.score_type===b.score_type?0:(a.score_type==='加分'?-1:1);
    if(ta!==0) return ta;
    const ca=a.category.localeCompare(b.category); if(ca!==0) return ca;
    return (a.sort_order-b.sort_order);
  });
  const data=rules.map(r=>({'类型':r.score_type,'分类':r.category,'原因':r.reason,'分值':r.points,'备注':r.remark||''}));
  downloadXLSX('积分规则.xlsx', data);
}
function importRulesFile(replace){
  if(replace){
    confirmDialog('确认','替换导入将清空现有所有积分规则，确定继续吗？',()=>doImportRules(true));
  } else {
    doImportRules(false);
  }
}
function doImportRules(replace){
  pickFile('.csv,.txt,.xlsx,.xls', file=>{
    readAsRows(file, async rows=>{
      let body=rows;
      if(body.length && /类型|score_type|type/i.test(body[0].join(''))) body=body.slice(1);
      const parsed=[];
      body.forEach(r=>{
        if(!r.length) return;
        let vals=r.slice();
        if(vals.length>=5 && /^\d+$/.test(String(vals[0]).trim())) vals=vals.slice(1);
        if(vals.length<4) return;
        const score_type=String(vals[0]||'').trim(), category=String(vals[1]||'').trim(), reason=String(vals[2]||'').trim();
        if(!score_type||!category||!reason) return;
        const points=parseFloat(vals[3]);
        if(isNaN(points)) return;
        parsed.push({score_type,category,reason,points,remark:String(vals[4]||'').trim()});
      });
      if(!parsed.length){ toast('文件中没有可导入的规则数据','err'); return; }
      const r=await call('importRules', { token, rules:parsed, replace });
      if(r.code!==0){ toast(r.msg,'err'); return; }
      const dd=await call('getData', { token });
      if(dd.code===0) DB=dd.data;
      renderRules();
      toast((replace?'替换导入成功':'追加导入成功')+'，共导入 '+r.count+' 条规则','ok');
    });
  });
}

function curMonthKey(){ return (APP&&APP.period&&APP.period.month_key) || todayStr(); }
// 周期一律来自「周期定义」（boundaries），按开始日期倒序
function monthPeriods(n){
  return (DB.boundaries||[]).filter(b=>b.type==='month'&&b.start_date)
    .slice().sort((a,b)=>String(b.start_date).localeCompare(String(a.start_date))).slice(0,n||12);
}
function weekPeriods(n){
  return (DB.boundaries||[]).filter(b=>b.type==='week'&&b.start_date)
    .slice().sort((a,b)=>String(b.start_date).localeCompare(String(a.start_date))).slice(0,n||12);
}
function lotMonths(n){ return monthPeriods(n).map(b=>b.period_key); }
function monthLabelOf(k){
  const b=(DB.boundaries||[]).find(x=>x.type==='month'&&String(x.period_key||'')===String(k||''));
  return b?periodRangeText(b,'month'):String(k||'');
}
function lotPeriodOf(){ return _lotPeriod||curMonthKey(); }
function curWeekKey(){ return (APP&&APP.period&&APP.period.week_key)||''; }
function lotWeeks(n){ return weekPeriods(n).map(b=>b.period_key); }
function lastClosedWeekKey(){
  const today=todayStr();
  const closed=weekPeriods(60).find(b=>b.end_date&&String(b.end_date)<today);
  return closed?closed.period_key:curWeekKey();
}
function weekBoundary(k){
  return (DB.boundaries||[]).find(b=>b.type==='week'&&String(b.period_key||'')===String(k||''))||null;
}
function weekStartOf(k){
  const b=weekBoundary(k);
  return b&&b.start_date?new Date(b.start_date+'T00:00:00+08:00'):null;
}
function weekEndExclOf(k){
  const b=weekBoundary(k);
  if(!b||!b.end_date) return null;
  const end=new Date(b.end_date+'T00:00:00+08:00');
  return new Date(end.getTime()+86400000);   // 含结束日 → 次日 00:00 为开区间上界
}
function weekMonthOf(k){
  const b=weekBoundary(k);
  if(!b||!b.start_date) return curMonthKey();
  const d=String(b.start_date);
  const mp=(DB.boundaries||[])
    .filter(x=>x.type==='month'&&x.start_date&&String(x.start_date)<=d&&(!x.end_date||String(x.end_date)>=d))
    .sort((a,c)=>String(c.start_date).localeCompare(String(a.start_date)))[0];
  return mp?mp.period_key:curMonthKey();
}
function weekLabelOf(k){
  const b=weekBoundary(k);
  return b?periodRangeText(b,'week'):String(k||'');
}
function lotWeekOf(){ return _lotWeek||lastClosedWeekKey(); }

  if(!ids.length){ toast('请先勾选学生','err'); return; }
  const poolName=POOL_NAME[_lotPool]||_lotPool;
  confirmDialog('批量抽选', `将对选中的 ${ids.length} 名学生各抽 1 次${poolName}，确定吗？`, async ()=>{
    const results=[]; let failed=0;
    for(const id of ids){
      const r=await rpc('draw_lottery',{ p_pool_type:_lotPool, p_student_id:id, p_count:1 });
      if(r.code!==0){ toast(r.msg,'err'); failed++; continue; }
      const draws=(r.data&&r.data.draws)||[];
      const one=draws[0]||{};
      const snap=one.item_snapshot||{};
      results.push({ label:one.student_name||one.name||'', title:snap.title||'未抽中', members:1, note:'个人', date:fmtDateTime(one.drawn_at||new Date()) });
    }
    playBatchResult(_lotPool, results, failed, '个人', async ()=>{ await reloadData(false); renderLotDrawArea(); });
  });
}

/* 批量抽选结果面板：小组按组展示、个人按人展示，一行一个对象 */
function playBatchResult(pool, results, failed, labelMode, after){

  const rows=okRows.map(r=>`<tr>

      <td>${esc(r.title)}</td>

    <div class="dim small" style="margin-bottom:10px">
      共提交 ${results.length+failed} 个对象，成功 ${okRows.length} 个${failed?`，失败 ${failed} 个`:''}；同一小组/同一对象本轮以最早一次写入为准。
