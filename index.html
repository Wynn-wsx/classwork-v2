/* 抽奖动画（仿“星光积分抽奖”）：滚动 -> 翻牌 -> 展示结果 */
function playLotteryAnim(pool, draws, after, opts){
  opts=opts||{};
  const items=(draws||[]).map(d=>((d.item_snapshot&&d.item_snapshot.title)||(d.item&&d.item.title)||'未抽中'));
  const isGroupDraw=!!opts.groupName;
  // 小组集体抽选：只抽到一个卡种，全组每人各持一张独立卡片 → 动画只翻一张
  const finalTitle=items.length?items[0]:'未抽中';
  const uniq=Array.from(new Set(items));
  const cardCount=isGroupDraw?(opts.groupCount||items.length):items.length;
  const poolName=POOL_NAME[pool]||pool;
  const dice=pool==='reward'
    ? ['免罚卡','3 星光','万能卡','5 星光','免扣分卡','10 星光','免值日卡','指定惩罚卡']
    : ['抄写 1 遍','扣星光 3','值日 1 天','扣星光 5','写检讨','班会说明'];
  openModal(`
    <h3 style="text-align:center;margin-bottom:4px">${poolName}抽奖机</h3>
    <div class="lot-stage">
      <div class="lot-ring ${pool==='reward'?'lot-ring-reward':'lot-ring-penalty'}"></div>
      <div class="lot-card" id="lotCard">
        <div class="lot-inner" id="lotInner">
          <div class="lot-face lot-back"><div class="lot-label">${poolName}池</div><div class="lot-big" id="lotShuffle">？</div></div>
          <div class="lot-face lot-front"><div class="lot-label">恭喜抽中</div><div class="lot-big" id="lotFinal">${esc(finalTitle)}</div></div>
        </div>
      </div>
    </div>
    <div class="lot-hint" id="lotHint">抽奖机转动中…</div>
    <div id="lotExtra" class="hidden">
      ${isGroupDraw
        ? `<div class="sub-title" style="text-align:center">「${esc(opts.groupName)}」全组 ${cardCount} 人每人各得一份（共 ${cardCount} 张，各自独立）</div>`
        : (uniq.length>1?`<div class="sub-title" style="text-align:center">本次共 ${uniq.length} 份结果</div>`:'')}
      ${isGroupDraw?'' : items.slice(1).map(x=>`<div class="draw-result"><div class="draw-title">${esc(x)}</div></div>`).join('')}
    </div>
    <div class="modal-actions"><button class="btn btn-primary hidden" id="lotOk">知道了</button></div>`);
  const sh=document.getElementById('lotShuffle');
  let i=0;
  const timer=setInterval(()=>{ if(sh) sh.textContent=dice[i++%dice.length]; }, 70);
  setTimeout(()=>{
    clearInterval(timer);
    const card=document.getElementById('lotCard');
    if(card) card.classList.add('flipped');
    const hint=document.getElementById('lotHint');
    if(hint) hint.textContent=isGroupDraw
      ? ('抽选完成：全组 '+cardCount+' 人每人一份')
      : (items.length>1?('抽选完成（'+items.length+' 份）'):'抽选完成');
    const extra=document.getElementById('lotExtra');
    if(extra) extra.classList.remove('hidden');
    const ok=document.getElementById('lotOk');
    if(ok){ ok.classList.remove('hidden'); ok.onclick=function(){ closeModal(); if(after) after(); }; }
  }, 1500);
}
async function renderLotDraws(){
  const scope = isStudent() ? 'self' : (isRecorder() ? 'group' : 'all');
  const r=await rpc('list_lottery_draws',{ p_scope:scope, p_status:_lotStatus||null, p_limit:1000 });
  if(r.code!==0){ document.getElementById('lotBody').innerHTML=`<div class="card"><div class="empty">${esc(r.msg)}</div></div>`; return; }
  const all=(r.data&&r.data.draws)||[];
  // 个人记录按月筛选；小组集体抽选（含周结算自动抽选）按周筛选
  const isGroupDraw=x=>!!x.is_group || String(x.source||'').indexOf('weekly_group')===0;
  const wkStart=(_lotWeek?weekStartOf(_lotWeek):null);
  const wkEndExcl=(_lotWeek?weekEndExclOf(_lotWeek):null);
  const list=all.filter(x=>{
    if(isGroupDraw(x)){
      if(!wkStart) return true;
      const t=new Date(x.drawn_at);
      return t>=wkStart && (!wkEndExcl || t<wkEndExcl);
    }
    return !_lotPeriod || String(x.period_key||'')===_lotPeriod;
  });
  DB._drawCache=list;
  const filterBar = `
    <div class="toolbar">

      ${lotWeekBar(true)}
      <span class="lbl">状态</span>
      <select class="field" onchange="_lotStatus=this.value; renderLotDraws()">

    </div>`;
  // 小组集体抽选：同一次抽选会给全组每人各生成一张独立卡片；
  // 记录列表按「一次抽选」合并成一行展示（卡片仍在「仓库管理」里按人独立处理）。
  const _groups=new Map();
  list.forEach(x=>{
    if(!x.is_group){ _groups.set('one:'+x.id, {rep:x, rows:[x], group:false}); return; }
    const stamp=String(x.drawn_at||'').slice(0,19);
    const key=['grp', x.group_name||'', x.source||'', (x.item_snapshot||{}).title||'', stamp, x.pool_type||''].join('|');
    if(!_groups.has(key)) _groups.set(key, {rep:x, rows:[], group:true});
    _groups.get(key).rows.push(x);
  });
  const body=[..._groups.values()].map(g=>{
    if(!g.group){
      const x=g.rep; const snap=x.item_snapshot||{};
      return `<tr>
        <td class="nowrap dim small">${esc(fmtDateTime(x.drawn_at))}</td>
        <td>${esc(x.student_name||'')}</td>
        <td>${esc(x.group_name||'')}</td>
        <td>${POOL_NAME[x.pool_type]||x.pool_type}</td>
        <td>${esc(snap.title||'')}</td>
        <td>${drawStatusBadge(x.status)}</td>
        <td class="nowrap dim small">${x.expire_at?esc(fmtDateTime(x.expire_at)):'长期'}</td>
        <td class="nowrap">
          ${((x.status==='unused'&&(isTeacher()||isRecorder()))||(x.status==='expired'&&isTeacher()))?`<button class="btn btn-sm" onclick="markDrawUsed('${esc(x.id)}')">${x.status==='expired'?'补登记使用':'标记已使用'}</button>`:''}
          ${(x.status==='unused'&&isAdmin())?`<button class="btn btn-sm btn-ghost" onclick="voidDraw('${esc(x.id)}')">作废</button>`:''}
        </td>
      </tr>`;
    }
    const x=g.rep; const snap=x.item_snapshot||{};
    const cnt=g.rows.length;
    const byStatus={};
    g.rows.forEach(r=>{ byStatus[r.status]=(byStatus[r.status]||0)+1; });
    const statusTxt=Object.keys(byStatus).map(k=>`${drawStatusBadge(k)}×${byStatus[k]}`).join(' ');
    return `<tr>
      <td class="nowrap dim small">${esc(fmtDateTime(x.drawn_at))}</td>
      <td><span class="badge-status badge-warn">全组</span> ${esc(x.group_name||'')} 组内 ${cnt} 人</td>
      <td>${esc(x.group_name||'')}</td>
      <td>${POOL_NAME[x.pool_type]||x.pool_type}</td>
      <td>${esc(snap.title||'')} <span class="dim small">（每人一份，共 ${cnt} 张）</span></td>
      <td>${statusTxt||drawStatusBadge(x.status)}</td>
      <td class="nowrap dim small">${x.expire_at?esc(fmtDateTime(x.expire_at)):'长期'}</td>

        :`<div class="empty">${(_lotPeriod||_lotWeek)?'该周期暂无抽选记录':'暂无抽选记录'}</div>`}
    </div>`;
  if(typeof fitTableWraps==='function') setTimeout(fitTableWraps, 60);
}

function periodRangeText(x, type){
  const key=(x&&x.period_key)||'';
  const ty=type||(x&&x.type)||'';
  if(x&&x.start_date) return x.end_date ? (fmtDay(x.start_date)+' ~ '+fmtDay(x.end_date)) : (fmtDay(x.start_date)+' ~ 进行中');
  const b=(DB.boundaries||[]).find(b=>String(b.period_key||'')===String(key)&&String(b.type||'')===String(ty));
  if(b){
    const s=fmtDay(b.start_date||key);
    return b.end_date ? (s+' ~ '+fmtDay(b.end_date)) : (s+' ~ 进行中');
  }
  if(x&&x.range_start&&x.range_end) return fmtDay(x.range_start)+' ~ '+fmtDay(x.range_end);
  return key;
}

async function resumPeriod(type){
  const sel=document.getElementById(type==='week'?'sumWeekSel':'sumMonthSel');
  const key=sel?sel.value:'';
  if(!key){ toast('请选择周期','err'); return; }
  const res=await rpc('list_summary_periods',{ p_type:type, p_limit:60 });
  const items=(res.code===0&&res.data&&res.data.items)||[];
  const target=items.find(x=>x.period_key===key);
  if(!target||!target.boundary_id){ toast('找不到该周期的分隔点记录','err'); return; }
  confirmDialog('重新汇总','将按最新数据重新生成 '+key+' 的汇总（覆盖旧结果），确定吗？', async ()=>{
    const r=await (type==='week'
      ? rpc('admin_run_weekly_summary',{ p_boundary_id:target.boundary_id })
      : rpc('admin_run_monthly_summary',{ p_boundary_id:target.boundary_id }));
    if(r.code!==0){ toast(r.msg,'err'); return; }
    toast('已重新汇总 '+key,'ok');
    await reloadData(false);
    if(type==='week') await renderWeekSummaries(); else await renderSettlements();
  });
}
async function runWeeklySummary(boundaryId){
  confirmDialog('立即汇总', boundaryId?'将按最新数据重新生成这一周的汇总（覆盖旧结果），确定吗？':'将按最新数据重新生成最近一个已结束周的汇总（覆盖旧结果），确定吗？', async ()=>{
    const r=await rpc('admin_run_weekly_summary', boundaryId?{ p_boundary_id:boundaryId }:{} );
    if(r.code!==0){ toast(r.msg,'err'); return; }
    toast('周汇总已更新：'+((r.data&&r.data.week_key)||''),'ok');
    await reloadData(false); renderWeekSummaries();
  });
}
async function runMonthlySummary(boundaryId){

function runMonthlyByKey(monthKey){

function fmtDay2(v){ if(!v) return '—'; const s=String(v).slice(0,10); const parts=s.split('-'); return parts.length===3 ? (parts[0]+'-'+(+parts[1])+'-'+(+parts[2])) : s; }
function periodRowsHtml(type){
  const all=(DB.boundaries||[]).filter(b=>b.type===type);
  const now=new Date(Date.now()+8*3600*1000).toISOString().slice(0,10);
  const rows=all.slice().sort((x,y)=>String(x.start_date).localeCompare(String(y.start_date)));
  const today=rows.filter(r=>String(r.start_date)<=now && (!r.end_date || String(r.end_date)>=now));
  const past=rows.filter(r=>r.end_date && String(r.end_date)<now).slice(-6);
  const future=rows.filter(r=>String(r.start_date)>now).slice(0,3);
  const show=past.concat(today).concat(future);
  if(!show.length) return '<tr><td colspan="5" class="empty">还没有周期，请先设置周与月</td></tr>';
  return show.map(r=>{
    const ongoing=!r.end_date;
    const cur=today.includes(r);
    const st=ongoing?'<span class="pill pill-warn">进行中</span>':(r.settled?'<span class="pill pill-ok">已结算</span>':'<span class="pill">未结算</span>');
    const canDel=!(cur || r.settled);
    const ops=`${canDel?`<button class="btn btn-mini btn-outline-danger" onclick="deletePeriod('${esc(r.id)}')">删除</button>`:''}`;
    if(type==='week') return `<tr><td class="nowrap">${esc(fmtDay2(r.start_date))}${cur?' <span class="badge-status">本周</span>':''}</td><td class="nowrap">${esc(fmtDay2(r.end_date))}</td><td>${r.rule_weeks||1}</td><td>${st}</td><td class="nowrap">${ops}</td></tr>`;
    return `<tr><td class="nowrap">${esc(fmtDay2(r.start_date))}${cur?' <span class="badge-status">本月</span>':''}</td><td class="nowrap">${esc(fmtDay2(r.end_date))}</td><td>${st}</td><td class="nowrap">${ops}</td></tr>`;
  }).join('');
}

function toggleMaintenance(on){
  let until=null;
  if(on){
    const el=document.getElementById('cfMaintUntil');
    if(el && el.value){
      const d=new Date(el.value);
      if(isNaN(d.getTime())){ toast('维护结束时间格式不正确','err'); return; }
      if(d.getTime()<=Date.now()){ toast('维护结束时间必须晚于当前时间','err'); return; }
      until=d.toISOString();
    }
  }
  const msg=on
    ? (until?('确定开启维护吗？全站只读，结束时间：'+fmtDateTime(until)+'。'):'确定开启维护吗？开启后全站只读，到期自动解除。')
    : '确定立即结束维护并恢复全站读写吗？';
  confirmDialog('确认', msg, async ()=>{
    const el2=document.getElementById('cfMaintMin');
    const mins=el2&&el2.value?(+el2.value||null):null;
    const r=await rpc('admin_toggle_maintenance', { p_on:on, p_minutes:mins, p_until:until });
    if(r.code!==0){ toast(r.msg,'err'); return; }
    await refreshPeriodState(); await loadAppState(); renderSettings();
    toast(on?'已开启维护':'已结束维护','ok');
  });
}

const NOTIFY_CAT={system:'系统',broadcast:'公告',lottery:'抽选',record:'积分',appeal:'申诉',starlight:'星光',period:'周期'};

async function renderInbox(){

    ${pageHeader('通知信箱', unread?('未读 '+unread):'')}
    <div class="card">
      <div class="toolbar">
        <button class="btn btn-sm" onclick="markAllRead()">全部标为已读</button>
        ${isTeacher()?`<button class="btn btn-sm btn-primary" onclick="openBroadcast()">发布公告</button>`:''}

      </div>

async function readNotify(id){
  const n=_inboxCache.find(function(x){ return String(x.id)===String(id); });
  const r=await rpc('mark_notification_read',{ p_id:id });
  if(r.code!==0) toast(r.msg||'标记已读失败','err');
  await refreshUnread();
  if(n){
    openModal('<h3>'+esc(n.title)+'</h3>'
      +'<div class="dim small" style="margin-bottom:10px">'+esc(NOTIFY_CAT[n.category]||n.category||'')+' · '+esc(fmtDateTime(n.created_at))+'</div>'
      +'<div style="white-space:pre-line;line-height:1.75;max-height:60vh;overflow:auto">'+esc(n.body||'（无正文）')+'</div>'
      +'<div class="modal-actions"><button class="btn" onclick="closeModal()">关闭</button></div>');
  }
  renderInbox();
}
async function markAllRead(){
  const r=await rpc('mark_all_notifications_read');
  if(r.code!==0){ toast(r.msg,'err'); return; }
  toast('已全部标为已读','ok'); await refreshUnread(); renderInbox();
}
function delNotify(id){
  confirmDialog('删除通知','确定删除这条通知吗？', async ()=>{
    const r=await rpc('admin_delete_notification',{ p_id:id });
    if(r.code!==0){ toast(r.msg,'err'); return; }
    renderInbox();
  });
}
async function refreshUnread(){
  const st=await rpc('get_app_state');
  if(st.code===0 && st.data){ APP.unread=(st.data||{}).unread||0; renderUnreadBadge(); }
}
function renderUnreadBadge(){
  const el=document.getElementById('navUnread');
  if(el){
    if(APP.unread>0){ el.textContent=APP.unread>99?'99+':String(APP.unread); el.classList.remove('hidden'); }
    else { el.textContent=''; el.classList.add('hidden'); }
  }
  const top=document.getElementById('unreadBadge');
  if(top) top.classList.add('hidden');
}
function openBroadcast(){
  openModal(`

    <div class="modal-field"><label>标题</label><input class="field" id="bcTitle" placeholder="例如：本周五下午大扫除"></div>

async function sendBroadcast(){
  const title=document.getElementById('bcTitle').value.trim();

    <div class="modal-field"><label>姓名</label><input class="field" id="rgName"></div>

      <button class="btn btn-primary" onclick="doRegister()">提交注册</button></div>`);

async function doRegister(){
  const code=document.getElementById('rgCode').value.trim();
  const no=document.getElementById('rgNo').value.trim();
  const name=document.getElementById('rgName').value.trim();
  const pass=document.getElementById('rgPass').value;
  if(!code||!no||!name||!pass){ toast('请填写完整信息','err'); return; }
  if(pass.length<6){ toast('密码至少 6 位','err'); return; }
  const { data, error } = await sb.rpc('student_register',{ p_code:code, p_no:no, p_name:name, p_password:pass });
  if(error){ toast(error.message,'err'); return; }
  if(data && data.ok===false){ toast(data.msg||'注册失败','err'); return; }
  closeModal();
  alertDialog('注册已提交', (data&&data.msg)||'注册成功，等待老师审核通过后即可登录（用户名=学号）。');
}

function markSlDirty(el){
  const v=String(el.value||'').trim();
  const o=String(el.getAttribute('data-orig')||'');
  el.classList.toggle('dirty', v!=='' && v!==o);
}
async function saveStarlightTable(){
  const inputs=Array.from(document.querySelectorAll('#page input.sl-bal'));
  const rows=[]; const bad=[];
  inputs.forEach(el=>{
    const sid=el.getAttribute('data-sid');
    const orig=Number(el.getAttribute('data-orig')||0);
    const raw=String(el.value||'').trim();
    if(raw===''){ bad.push('有单元格被清空'); return; }
    const val=Number(raw);
    if(!isFinite(val) || !Number.isInteger(val)){ bad.push('存在非整数：'+raw); return; }
    if(val!==orig) rows.push({ student_id:sid, balance:val });
  });
  if(bad.length){ toast(bad[0],'err'); return; }
  if(!rows.length){ toast('没有修改任何数值','err'); return; }
  const note=((document.getElementById('slSaveNote')||{}).value||'').trim() || '表格批量修正星光值';
  confirmDialog('保存表格修改', '共 '+rows.length+' 名学生星光值有变化，将按差额生成手动流水，确定保存吗？', async ()=>{
    const r=await rpc('starlight_batch_set_balance',{ p_rows:rows, p_note:note });
    if(r.code!==0){ toast(r.msg,'err'); return; }
    const d=r.data||{};
    toast('已保存：修改 '+(d.changed||0)+' 人，跳过 '+(d.skipped||0)+' 人','ok');
    if((d.errors||[]).length) console.warn('星光修正跳过原因', d.errors);
    await reloadData(false); renderStarlightLedger();
  });
}

function openAssignSupervisor(){
  const students=sortStudentsByGroup(DB.students);
  openModal(`
    <h3>指派本周监督委员</h3>
    <div class="dim small" style="margin-bottom:8px">可多选，最多 ${(APP.config||{}).max_supervisors||2} 名。</div>
    <div class="check-list" id="svList">
      ${(()=>{
        const map=new Map();
        students.forEach(s=>{ const g=String(s.group_name==null?'':s.group_name).trim(); if(!map.has(g)) map.set(g,[]); map.get(g).push(s); });
        const keys=[...map.keys()].sort(cmpGroupName);
        if(!keys.length) return '<div class="empty">暂无学生</div>';
        return keys.map(g=>`<div class="dim small" style="margin:8px 0 2px">${esc(groupLabel(g))}</div>`
          + map.get(g).map(s=>`<label class="check-item"><input type="checkbox" value="${esc(s._id)}"> ${esc(s.name)}</label>`).join('')).join('');
      })()}
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="submitAssignSupervisor()">指派</button></div>`);
}
async function submitAssignSupervisor(){
  const ids=[...document.querySelectorAll('#svList input:checked')].map(x=>x.value);

  const r=await rpc('admin_assign_supervisor',{ p_period_key:(APP.period||{}).week_key||null, p_student_ids:ids });

  closeModal(); toast('已指派','ok'); renderSupervisors();

function revokeSupervisor(id){

function auditActionCN(a){ return ACTION_CN[a]||a||''; }
function auditDetailCN(d){
  if(!d || typeof d!=='object') return '';
  const map={reason:'原因',points:'分值',score_type:'类型',category:'分类',week_key:'周',month_key:'月',
    name:'姓名',group_name:'小组',amount:'次数',count:'数量',role:'角色',status:'状态',username:'用户名',
    item:'条目',members:'成员数',pool:'奖池',source_week:'来源周',deleted:'删除数',inserted:'新增',updated:'更新',
    skipped:'跳过',restored:'恢复',cleared:'清空',week_reward_top_groups:'奖励小组数',week_penalty_bottom_groups:'惩罚小组数'};
  const parts=[];
  Object.keys(d).forEach(k=>{
    const v=d[k];
    if(v===null||v===undefined||v==='') return;
    if(typeof v==='object') return;
    parts.push((map[k]||k)+'：'+v);
  });
  return parts.join('，');
}
